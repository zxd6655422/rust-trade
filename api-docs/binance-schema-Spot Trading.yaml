  /api/v3/orderList/otoco:
    post:
      summary: New 订单 列表- OTOCO
      description: |-
        发送一个新的 OTOCO 订单。

        - 一个 OTOCO 订单（One-Triggers-One-Cancels-the-Other）是一个包含了三个订单的订单列表。
        - 第一个订单被称为**生效订单**，必须为 `LIMIT` 或 `LIMIT_MAKER` 类型的订单。最初，订单簿上只有生效订单。
          - 生效订单的行为与此一致 [OTO](#order-list-oto)
        - 一个OTOCO订单有两个待处理订单（pending above 和 pending below），它们构成了一个 OCO 订单列表。只有当生效订单**完全成交**时，待处理订单们才会被自动下单。
          - 待处理上方(pending above)订单和待处理下方(pending below)订单都遵循与 OCO 订单列表相同的规则 [OrderList OCO](#order-list-oco)。
        - `OTOCO` 在 `EXCHANGE_MAX_NUM_ORDERS` 过滤器和 `MAX_NUM_ORDERS` 过滤器的基础上添加**3个订单**。
      tags:
        - trade
      operationId: orderListOtoco
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/rest-api/trade#order-list-otoco
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/rest-api/TradeApi/orderListOtoco.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/rest_api/trade_api/order_list_otoco.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/rest_api/Trade/order_list_otoco.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/rest/trade/OrderListOtocoExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/restapi/TradeAPI/OrderListOtoco/OrderListOtoco.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/spot/trade/OrderListOtocoExample.php
      x-ip-weight: 1
      x-order-weight: 3
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
      x-parameters-notes: |-
        **数据源:** 撮合引擎

        **根据 `pendingAboveType`， `pendingBelowType` 或者`workingType`的不同值，对于某些参数的强制要求**

        根据 `pendingAboveType`， `pendingBelowType` 或者`workingType`的不同值，对于某些可选参数有强制要求，具体如下：

        |类型                                                        | 强制要求的参数                  | 其他信息|
        |----                                                       |----                           |------
        |`workingType` = `LIMIT`                                    |`workingTimeInForce`           |
        |`pendingAboveType` = `LIMIT_MAKER`                                |`pendingAbovePrice`     |
        |`pendingAboveType` = `STOP_LOSS/TAKE_PROFIT` | `pendingAboveStopPrice` 与/或  `pendingAboveTrailingDelta` |
        |`pendingAboveType` = `STOP_LOSS_LIMIT/TAKE_PROFIT_LIMIT` | `pendingAbovePrice`， `pendingAboveStopPrice` 与/或 `pendingAboveTrailingDelta`， `pendingAboveTimeInForce` |
        |`pendingBelowType` = `LIMIT_MAKER`                                |`pendingBelowPrice`          |
        |`pendingBelowType` = `STOP_LOSS/TAKE_PROFIT` | `pendingBelowStopPrice` 与/或 `pendingBelowTrailingDelta` |
        |`pendingBelowType` = `STOP_LOSS_LIMIT/TAKE_PROFIT_LIMIT` | `pendingBelowPrice`， `pendingBelowStopPrice` 与/或 `pendingBelowTrailingDelta`， `pendingBelowTimeInForce` |
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - symbol
                - workingType
                - workingSide
                - workingPrice
                - workingQuantity
                - pendingSide
                - pendingQuantity
                - pendingAboveType
                - timestamp
              properties:
                symbol:
                  type: string
                  example: BNBUSDT
                listClientOrderId:
                  type: string
                  example: RumwQpBaDctlUu5jyG5rs0
