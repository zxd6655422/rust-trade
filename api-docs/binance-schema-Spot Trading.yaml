                  description: 请看 [追踪止盈止损(Trailing Stop)订单常见问题](/products/spot/faqs/trailing-stop-faq)
                aboveTimeInForce:
                  type: string
                  enum:
                    - GTC
                    - IOC
                    - FOK
                  example: GTC
                  description: 如果 `aboveType` 是 `STOP_LOSS_LIMIT` 或 `TAKE_PROFIT_LIMIT`，则为必填项。
                aboveStrategyId:
                  type: integer
                  format: int64
                  example: 1
