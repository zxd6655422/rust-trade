  /fapi/v1/aggTrades:
    get:
      summary: 近期成交
      description: |-
        获取归集/压缩的市场成交记录。100ms内价格和买卖方向相同的成交会被归集成一条记录。

        零点价差改善订单（RPI订单）会被归集，并且没有特殊标签区分。
      tags:
        - market-data
      operationId: compressedAggregateTradesList
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/rest-api/market-data#compressed-aggregate-trades-list
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/rest-api/MarketDataApi/compressedAggregateTradesList.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/rest_api/market_data_api/compressed_aggregate_trades_list.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/rest_api/MarketData/compressed_aggregate_trades_list.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/rest/marketdata/CompressedAggregateTradesListExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/restapi/MarketDataAPI/CompressedAggregateTradesList/CompressedAggregateTradesList.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-usds-futures/marketdata/CompressedAggregateTradesListExample.php
      x-ip-weight: 20
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
          description: 交易对
        - name: fromId
          in: query
          required: false
          schema:
            type: integer
            example: 1
            format: int64
          description: 从包含fromID的成交开始返回结果
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            example: 1623319461670
            format: int64
          description: 从该时刻之后的成交记录开始返回结果
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            example: 1641782889000
            format: int64
          description: 返回该时刻为止的成交记录
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 50
            format: int64
            default: 500
            maximum: 1000
      x-parameters-notes: |-
        - 接口仅支持查询最近24小时的交易数据
        - 如果同时发送`startTime`和`endTime`，间隔必须小于一小时
        - 如果没有发送任何筛选参数(`fromId`, `startTime`, `endTime`)，默认返回最近的成交记录
        - 保险基金和自动减仓(ADL)成交不属于订单簿成交，故不会被归并聚合
        - 同时发送`startTime`/`endTime`和`fromId`可能导致请求超时，建议仅发送`fromId`或仅发送`startTime`和`endTime`
      responses:
        '200':
          description: Compressed/Aggregate 交易s 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    a:
                      type: integer
                      example: 26129
                      format: int64
                      description: 归集成交ID
                    p:
                      type: string
                      example: '0.01633102'
                      description: 成交价
                    q:
                      type: string
                      example: '4.70443515'
                      description: 成交量
                    nq:
                      type: string
                      example: '100'
                      description: 普通订单成交量，不包含RPI订单数据
                    f:
                      type: integer
                      example: 27781
                      format: int64
                      description: 被归集的首个成交ID
                    l:
                      type: integer
                      example: 27781
                      format: int64
                      description: 被归集的末个成交ID
                    T:
                      type: integer
                      example: 1498793709153
                      format: int64
                      description: 成交时间
                    m:
                      type: boolean
                      example: true
                      description: 是否为主动卖出单
