openapi: 3.0.2
info:
  title: Futures (USDⓈ-M) WebSocket Market Streams
  description: 访问市场数据、管理账户，并交易 USDⓈ-M 永续合约。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: ws-streams
x-user-data-streams: true
externalDocs:
  description: Futures (USDⓈ-M) docs
  url: https://developers.binance.com/en/docs/products/derivatives-trading-usds-futures/general-info
tags:
  - name: public
    x-displayName: 公开
  - name: market
    x-displayName: 市场
servers:
  - url: wss://fstream.binance.com
  - url: wss://stream.binancefuture.com
paths:
  /{symbol}@aggTrade:
    post:
      summary: 归集交易
      description: |-
        归集交易流每100毫秒推送一次市场交易信息，这些信息是针对相同价格和方向的成交进行归集的。只有市场交易会被归集，保险基金交易和ADL交易不会被归集。

        > **迁移后**,payload 末尾新增 `st` 字段(`1` = UM,`2` = CM)。
      tags:
        - market
      operationId: aggregateTradeStreams
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/ws-streams/market#aggregate-trade-streams
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/websocket-streams/MarketApi/aggregateTradeStreams.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/websocket_streams/market_api/aggregate_trade_streams.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/websocket_streams/Market/aggregate_trade_streams.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/websocket/stream/websocketmarketstreams/market/AggregateTradeStreamsExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/websocketstreams//MarketAPI/AggregateTradeStreams/AggregateTradeStreams.go
      x-update-speed: 100ms
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一 WebSocket 请求 ID。
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: btcusdt
          description: 交易对参数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - btcusdt@aggTrade
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - btcusdt@aggTrade
              id: e9d6b4349871b40611412680b3445fac
      x-response-notes: '- 零售价格改进（RPI）订单被归集到字段 q 中，并且没有特殊标签来区分。'
      responses:
        Raw Stream:
          description: 归集成交流
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: aggTrade
                    description: 事件类型
                  E:
                    type: integer
                    example: 123456789
                    format: int64
                    description: 事件时间
                  s:
                    type: string
                    example: BNBUSDT
                    description: 交易对
                  a:
                    type: integer
                    example: 5933014
                    format: int64
                    description: 归集成交 ID
                  p:
                    type: string
                    example: '0.001'
                    description: 成交价格
                  q:
                    type: string
                    example: '100'
                    description: 成交量，包含RPI订单数据
                  nq:
                    type: string
                    example: '100'
                    description: 普通订单成交量，不包含RPI订单数据
                  f:
                    type: integer
                    example: 100
                    format: int64
                    description: 被归集的首个交易ID
                  l:
                    type: integer
                    example: 105
                    format: int64
                    description: 被归集的末次交易ID
                  T:
                    type: integer
                    example: 123456785
                    format: int64
                    description: 成交时间
                  m:
                    type: boolean
                    example: true
                    description: 买方是否是做市方。如true，则此次成交是一个主动卖出单，否则是一个主动买入单。
                  st:
                    type: integer
                    example: 1
                    description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
              example:
                e: aggTrade
                E: 123456789
                s: BNBUSDT
                a: 5933014
                p: '0.001'
                q: '100'
                nq: '100'
                f: 100
                l: 105
                T: 123456785
                m: true
                st: 1
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: btcusdt@aggTrade
                  data:
                    type: object
                    properties:
                      e:
                        type: string
                        example: aggTrade
                        description: 事件类型
                      E:
                        type: integer
                        example: 123456789
                        format: int64
                        description: 事件时间
                      s:
                        type: string
                        example: BNBUSDT
                        description: 交易对
                      a:
                        type: integer
                        example: 5933014
                        format: int64
                        description: 归集成交 ID
                      p:
                        type: string
                        example: '0.001'
                        description: 成交价格
                      q:
                        type: string
                        example: '100'
                        description: 成交量，包含RPI订单数据
                      nq:
                        type: string
                        example: '100'
                        description: 普通订单成交量，不包含RPI订单数据
                      f:
                        type: integer
                        example: 100
                        format: int64
                        description: 被归集的首个交易ID
                      l:
                        type: integer
                        example: 105
                        format: int64
                        description: 被归集的末次交易ID
                      T:
                        type: integer
                        example: 123456785
                        format: int64
                        description: 成交时间
                      m:
                        type: boolean
                        example: true
                        description: 买方是否是做市方。如true，则此次成交是一个主动卖出单，否则是一个主动买入单。
                      st:
                        type: integer
                        example: 1
                        description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: btcusdt@aggTrade
                data:
                  e: aggTrade
                  E: 123456789
                  s: BNBUSDT
                  a: 5933014
                  p: '0.001'
                  q: '100'
                  nq: '100'
                  f: 100
                  l: 105
                  T: 123456785
                  m: true
                  st: 1
  /!forceOrder@arr:
    post:
      summary: 全市场强平订单
      description: |-
        全市场强平订单快照流推送市场上所有交易对的强平订单信息。对于每个交易对，在1000毫秒内只会推送最新的一笔强平订单作为快照。如果在1000毫秒的时间间隔内没有发生强平，则不会推送任何流。

        > **迁移后**,此 stream 推送合并的 UM + CM universe(`fstream` 与 `dstream` 都可订阅);payload 末尾新增 `st` 字段(`1` = UM,`2` = CM)以及 `ps`(pair symbol)字段。
      tags:
        - market
      operationId: allMarketLiquidationOrderStreams
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/ws-streams/market#all-market-liquidation-order-streams
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/websocket-streams/MarketApi/allMarketLiquidationOrderStreams.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/websocket_streams/market_api/all_market_liquidation_order_streams.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/websocket_streams/Market/all_market_liquidation_order_streams.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/websocket/stream/websocketmarketstreams/market/AllMarketLiquidationOrderStreamsExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/websocketstreams//MarketAPI/AllMarketLiquidationOrderStreams/AllMarketLiquidationOrderStreams.go
      x-update-speed: 1000ms
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一 WebSocket 请求 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - '!forceOrder@arr'
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - '!forceOrder@arr'
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: 全市场强平订单流
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: forceOrder
                    description: 事件类型
                  E:
                    type: integer
                    example: 1568014460893
                    format: int64
                    description: 事件时间
                  o:
                    type: object
                    properties:
                      s:
                        type: string
                        example: BTCUSDT
                        description: 交易对
                      S:
                        type: string
                        example: SELL
                        description: 订单方向
                      o:
                        type: string
                        example: LIMIT
                        description: 订单类型
                      f:
                        type: string
                        example: IOC
                        description: 有效方式
                      q:
                        type: string
                        example: '0.014'
                        description: 订单数量
                      p:
                        type: string
                        example: '9910'
                        description: 订单价格
                      ap:
                        type: string
                        example: '9910'
                        description: 平均价格
                      X:
                        type: string
                        example: FILLED
                        description: 订单状态
                      l:
                        type: string
                        example: '0.014'
                        description: 订单最近成交量
                      z:
                        type: string
                        example: '0.014'
                        description: 订单累计成交量
                      T:
                        type: integer
                        example: 1568014460893
                        format: int64
                        description: 交易时间
                    description: 订单类型
                  ps:
                    type: string
                    example: BTCUSDT
                    description: (迁移后新增) 标的交易对
                  st:
                    type: integer
                    example: 1
                    description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
              example:
                e: forceOrder
                E: 1568014460893
                o:
                  s: BTCUSDT
                  S: SELL
                  o: LIMIT
                  f: IOC
                  q: '0.014'
                  p: '9910'
                  ap: '9910'
                  X: FILLED
                  l: '0.014'
                  z: '0.014'
                  T: 1568014460893
                ps: BTCUSDT
                st: 1
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: '!forceOrder@arr'
                  data:
                    type: object
                    properties:
                      e:
                        type: string
                        example: forceOrder
                        description: 事件类型
                      E:
                        type: integer
                        example: 1568014460893
                        format: int64
                        description: 事件时间
                      o:
                        type: object
                        properties:
                          s:
                            type: string
                            example: BTCUSDT
                            description: 交易对
                          S:
                            type: string
                            example: SELL
                            description: 订单方向
                          o:
                            type: string
                            example: LIMIT
                            description: 订单类型
                          f:
                            type: string
                            example: IOC
                            description: 有效方式
                          q:
                            type: string
                            example: '0.014'
                            description: 订单数量
                          p:
                            type: string
                            example: '9910'
                            description: 订单价格
                          ap:
                            type: string
                            example: '9910'
                            description: 平均价格
                          X:
                            type: string
                            example: FILLED
                            description: 订单状态
                          l:
                            type: string
                            example: '0.014'
                            description: 订单最近成交量
                          z:
                            type: string
                            example: '0.014'
                            description: 订单累计成交量
                          T:
                            type: integer
                            example: 1568014460893
                            format: int64
                            description: 交易时间
                        description: 订单类型
                      ps:
                        type: string
                        example: BTCUSDT
                        description: (迁移后新增) 标的交易对
                      st:
                        type: integer
                        example: 1
                        description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: '!forceOrder@arr'
                data:
                  e: forceOrder
                  E: 1568014460893
                  o:
                    s: BTCUSDT
                    S: SELL
                    o: LIMIT
                    f: IOC
                    q: '0.014'
                    p: '9910'
                    ap: '9910'
                    X: FILLED
                    l: '0.014'
                    z: '0.014'
                    T: 1568014460893
                  ps: BTCUSDT
                  st: 1
  /!miniTicker@arr:
    post:
      summary: 全市场的精简Ticker
      description: |-
        所有交易对的24小时滚动窗口精简Ticker统计。这些不是UTC日的统计数据，而是从请求时间到24小时前的24小时滚动窗口。请注意，只有发生变化的Ticker才会出现在数组中。

        > **迁移后**,此 stream 推送合并的 UM + CM universe(`fstream` 与 `dstream` 都可订阅);payload 末尾新增 `st` 字段(`1` = UM,`2` = CM)以及 `ps`(pair symbol)字段。
      tags:
        - market
      operationId: allMarketMiniTickersStream
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/ws-streams/market#all-market-mini-tickers-stream
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/websocket-streams/MarketApi/allMarketMiniTickersStream.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/websocket_streams/market_api/all_market_mini_tickers_stream.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/websocket_streams/Market/all_market_mini_tickers_stream.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/websocket/stream/websocketmarketstreams/market/AllMarketMiniTickersStreamExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/websocketstreams//MarketAPI/AllMarketMiniTickersStream/AllMarketMiniTickersStream.go
      x-update-speed: 1000ms
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一 WebSocket 请求 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - '!miniTicker@arr'
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - '!miniTicker@arr'
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: 全市场精简行情流
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    e:
                      type: string
                      example: 24hrMiniTicker
                      description: 事件类型
                    E:
                      type: integer
                      example: 123456789
                      format: int64
                      description: 事件时间(毫秒)
                    s:
                      type: string
                      example: BNBUSDT
                      description: 交易对
                    c:
                      type: string
                      example: '0.0025'
                      description: 最新成交价格
                    o:
                      type: string
                      example: '0.0010'
                      description: 24小时前开始第一笔成交价格
                    h:
                      type: string
                      example: '0.0025'
                      description: 24小时内最高成交价
                    l:
                      type: string
                      example: '0.0010'
                      description: 24小时内最低成交价
                    v:
                      type: string
                      example: '10000'
                      description: 成交量
                    q:
                      type: string
                      example: '18'
                      description: 成交额
                    ps:
                      type: string
                      example: BTCUSDT
                      description: (迁移后新增) 标的交易对
                    st:
                      type: integer
                      example: 1
                      description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
              example:
                - e: 24hrMiniTicker
                  E: 123456789
                  s: BNBUSDT
                  c: '0.0025'
                  o: '0.0010'
                  h: '0.0025'
                  l: '0.0010'
                  v: '10000'
                  q: '18'
                  ps: BTCUSDT
                  st: 1
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: '!miniTicker@arr'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        e:
                          type: string
                          example: 24hrMiniTicker
                          description: 事件类型
                        E:
                          type: integer
                          example: 123456789
                          format: int64
                          description: 事件时间(毫秒)
                        s:
                          type: string
                          example: BNBUSDT
                          description: 交易对
                        c:
                          type: string
                          example: '0.0025'
                          description: 最新成交价格
                        o:
                          type: string
                          example: '0.0010'
                          description: 24小时前开始第一笔成交价格
                        h:
                          type: string
                          example: '0.0025'
                          description: 24小时内最高成交价
                        l:
                          type: string
                          example: '0.0010'
                          description: 24小时内最低成交价
                        v:
                          type: string
                          example: '10000'
                          description: 成交量
                        q:
                          type: string
                          example: '18'
                          description: 成交额
                        ps:
                          type: string
                          example: BTCUSDT
                          description: (迁移后新增) 标的交易对
                        st:
                          type: integer
                          example: 1
                          description: (迁移后新增) Symbol 类型:1 = UM,2 = CM
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: '!miniTicker@arr'
                data:
                  - e: 24hrMiniTicker
                    E: 123456789
                    s: BNBUSDT
                    c: '0.0025'
                    o: '0.0010'
                    h: '0.0025'
                    l: '0.0010'
                    v: '10000'
                    q: '18'
                    ps: BTCUSDT
                    st: 1
  /!ticker@arr:
    post:
      summary: 全市场的完整Ticker
      description: |-
        所有交易对的24小时滚动窗口完整Ticker统计。这些不是UTC日的统计数据，而是从请求时间到24小时前的24小时滚动窗口。请注意，只有发生变化的Ticker才会出现在数组中。

        > **迁移后**,此 stream 推送合并的 UM + CM universe(`fstream` 与 `dstream` 都可订阅);payload 末尾新增 `st` 字段(`1` = UM,`2` = CM)以及 `ps`(pair symbol)字段。
      tags:
        - market
      operationId: allMarketTickersStreams
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/ws-streams/market#all-market-tickers-streams
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/websocket-streams/MarketApi/allMarketTickersStreams.ts
