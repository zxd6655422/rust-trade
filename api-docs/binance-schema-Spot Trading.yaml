        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/restapi/TradeAPI/OrderListOto/OrderListOto.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/spot/trade/OrderListOtoExample.php
