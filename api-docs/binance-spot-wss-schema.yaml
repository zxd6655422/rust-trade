                <td>
                <ul>
                    <li><code>timeInForce</code></li>
                    <li><code>price</code></li>
                    <li><code>quantity</code></li>
                    <li><code>stopPrice</code> 或者 <code>trailingDelta</code></li>
                </ul>
                </td>
            </tr>
            <tr>
                <td><code>TAKE_PROFIT</code></td>
                <td>
