          description: 平均价格
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: avgPrice
                    description: 事件类型
                  E:
                    type: integer
                    format: int64
                    example: 1693907033000
                    description: 事件时间
                  s:
                    type: string
