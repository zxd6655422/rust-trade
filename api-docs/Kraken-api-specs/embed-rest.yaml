ier.","enum":["custom_order.executed"],"example":"custom_order.executed"},"iiban":{"type":"string","description":"The Internet International Bank Account Number (IIBAN) of the user whose custom order was executed.","example":"AA00 TEST EXAM PLE1"},"id":{"type":"string","description":"The unique identifier of the custom order (scheduled action ID).","example":"AEGXGV-JZ4I2-6QXEJS"},"timestamp":{"type":"string","format":"date-time","description":"The timestamp when the order was executed (ISO-8601 format).","example":"2025-01-15T10:30:00.000000000Z"},"action":{"$ref":"#/components/schemas/CustomOrderTradeAction"},"trigger":{"$ref":"#/components/schemas/PriceTrigger"},"execution_details":{"$ref":"#/components/schemas/ExecutionDetails","description":"Runtime details captured from the underlying trade execution. Present\nwhen the upstream trade emits execution details for the occurrence;\nomitted otherwise.\n"}},"required":["event_type","iiban","id","timestamp","action","trigger"]},"ExecutionDetails":{"type":"object","description":"Runtime details captured from the executed trade.\n","properties":{"quote_id":{"type":"string","description":"The transaction identifier (quote ID) associated with the executed trade.","example":"BQEXAMP-LE123-ABCDEF"},"spend":{"$ref":"#/components/schemas/AssetAmount","description":"The spend-side asset and amount actually executed."},"receive":{"$ref":"#/components/schemas/AssetAmount","description":"The receive-side asset and amount actually executed."},"total_fee":{"$ref":"#/components/schemas/AssetAmount","description":"The total fee charged for the execution."},"unit_price":{"$ref":"#/components/schemas/AssetAmount","description":"The unit price applied to the execution."},"executed_at":{"type":"string","format":"date-time","description":"The timestamp when the upstream trade was executed (ISO-8601 format).","example":"2025-01-15T10:30:00.000000000Z"}},"required":["quote_id"]},"CustomOrderFailedReason":{"type":"object","description":"Reason for a custom order execution failure.","properties":{"type":{"type":"string","description":"The reason category.","enum":["failed"],"example":"failed"},"detail":{"type":"string","description":"The specific failure reason. Possible values:\n`system_error`, `insufficient_market_liquidity`, `insufficient_funds`,\n`card_processing_failure`, `trade_amount_too_small`, `trade_amount_too_large`,\n`user_locked`, `card_transaction_declined_by_issuer`, `user_temporarily_restricted`,\n`asset_coming_soon`, `withdrawal_amount_too_small`, `canadian_acquisition_limit_exceeded`,\n`withdrawal_amount_too_large`, `canadian_suitability_limit_exceeded`,\n`user_kyc_deny_trading`, `user_kyc_finprom_survey`, `user_kyc_finprom_assessment_locked`,\n`user_kyc_onboarding_cool_off`, `insufficient_margin`,\n`funding_rail_transaction_limit_exceeded`, `user_bundle_without_balance`,\n`retry_exhausted_unsatisfying_unit_price`.\n","enum":["system_error","insufficient_market_liquidity","insufficient_funds","card_processing_failure","trade_amount_too_small","trade_amount_too_large","user_locked","card_transaction_declined_by_issuer","user_temporarily_restricted","asset_coming_soon","withdrawal_amount_too_small","canadian_acquisition_limit_exceeded","withdrawal_amount_too_large","canadian_suitability_limit_exceeded","user_kyc_deny_trading","user_kyc_finprom_survey","user_kyc_finprom_assessment_locked","user_kyc_onboarding_cool_off","insufficient_margin","funding_rail_transaction_limit_exceeded","user_bundle_without_balance","retry_exhausted_unsatisfying_unit_price"],"example":"insufficient_funds"}},"required":["type","detail"]},"CustomOrderExecutionFailedEvent":{"type":"object","description":"Sent when a custom order execution has failed. The price trigger condition was met,\nbut the trade could not be completed. The `reason` field indicates why the execution failed.\n","properties":{"event_type":{"type":"string","description":"The event type identifier.","enum":["custom_order.execution_failed"],"example":"custom_order.execution_failed"},"iiban":{"type":"string","description":"The Internet International Bank Account Number (IIBAN) of the user whose custom order execution failed.","example":"AA00 TEST EXAM PLE1"},"id":{"type":"string","description":"The unique identifier of the custom order (scheduled action ID).","example":"AEGXGV-JZ4I2-6QXEJS"},"reason":{"$ref":"#/components/schemas/CustomOrderFailedReason"},"timestamp":{"type":"string","format":"date-time","description":"The timestamp when the execution failed (ISO-8601 format).","example":"2025-01-15T10:30:00.000000000Z"},"action":{"$ref":"#/components/schemas/CustomOrderTradeAction"},"trigger":{"$ref":"#/components/schemas/PriceTrigger"}},"required":["event_type","iiban","id","timestamp","action","trigger"]},"CustomOrderCancelledReason":{"type":"object","description":"Reason for a custom order cancellation.","properties":{"type":{"type":"string","description":"The reason category.","enum":["cancelled"],"example":"cancelled"},"detail":{"type":"string","description":"The specific cancellation reason. Possible values:\n`user_request`, `user_locked`, `expired_payment_method`, `asset_unavailable`,\n`pair_unavailable`, `retries_exhausted`, `funding_method_deleted`,\n`user_bundle_dissolved`, `user_bundle_liquidated`, `no_balances_to_rebalance_bundle`,\nor an `other` variant with freeform details.\n","example":"user_request"}},"required":["type","detail"]},"CustomOrderCancelledEvent":{"type":"object","description":"Sent when a custom order was cancelled. This can happen when the user explicitly\ncancels the order, or when the system cancels it due to account restrictions,\nasset unavailability, or other conditions.\n","properties":{"event_type":{"type":"string","description":"The event type identifier.","enum":["custom_order.cancelled"],"example":"custom_order.cancelled"},"iiban":{"type":"string","description":"The Internet International Bank Account Number (IIBAN) of the user whose custom order was cancelled.","example":"AA00 TEST EXAM PLE1"},"id":{"type":"string","description":"The unique identifier of the custom order (scheduled action ID).","example":"AEGXGV-JZ4I2-6QXEJS"},"reason":{"$ref":"#/components/schemas/CustomOrderCancelledReason"},"timestamp":{"type":"string","format":"date-time","description":"The timestamp when the order was cancelled (ISO-8601 format).","example":"2025-01-15T10:30:00.000000000Z"},"action":{"$ref":"#/components/schemas/CustomOrderTradeAction"},"trigger":{"$ref":"#/components/schemas/PriceTrigger"}},"required":["event_type","iiban","id","reason","timestamp","action","trigger"]},"QuoteExecutedEvent":{"type":"object","description":"Sent when a quote has been successfully executed.","properties":{"event_type":{"type":"string","description":"The event type identifier.","enum":["quote.executed"],"example":"quote.executed"},"iiban":{"type":"string","description":"The Internet International Bank Account Number (IIBAN) of the user who executed the quote.","example":"AA00 TEST EXAM PLE1"},"quote_id":{"type":"string","description":"The unique identifier of the executed quote.","example":"BQEXAMP-LE123-ABCDEF"},"timestamp":{"type":"string","format":"date-time","description":"The timestamp when the quote was executed (ISO-8601 format).","example":"2025-01-15T10:30:00.000000000Z"}},"required":["event_type","iiban","quote_id","timestamp"]},"QuoteExecutionFailedEvent":{"type":"object","description":"Sent when a quote execution has failed.","properties":{"event_type":{"type":"string","description":"The event type identifier.","enum":["quote.execution_failed"],"example":"quote.execution_failed"},"iiban":{"type":"string","description":"The Internet International Bank Account Number (IIBAN) of the user whose quote execution failed.","example":"AA00 TEST EXAM PLE1"},"quote_id":{"type":"string","description":"The unique identifier of the failed quote.","example":"BQEXAMP-LE123-ABCDEF"},"reason":{"type":"string","description":"A free-form, human-readable description of why the quote execution failed.\nThis field is intended for display and logging purposes only. Clients should\nnot rely on specific reason strings for programmatic decision-making, as the\nexact wording may change without notice.\n","example":"Insufficient funds"},"timestamp":{"type":"string","format":"date-time","description":"The timestamp when the quote execution failed (ISO-8601 format).","example":"2025-01-15T10:30:00.000000000Z"}},"required":["event_type","iiban","quote_id","reason","timestamp"]},"QuoteCancelledEvent":{"type":"object","description":"Sent when a quote was cancelled before execution.","properties":{"event_type":{"type":"string","description":"The event type identifier.","enum":["quote.cancelled"],"example":"quote.cancelled"},"iiban":{"type":"string","description":"The Internet International Bank Account Number (IIBAN) of the user whose quote was cancelled.","example":"AA00 TEST EXAM PLE1"},"quote_id":{"type":"string","description":"The unique identifier of the cancelled quote.","example":"BQEXAMP-LE123-ABCDEF"},"reason":{"type":"string","description":"A free-form, human-readable description of why the quote was cancelled.\nThis field is intended for display and logging purposes only. Clients should\nnot rely on specific reason strings for programmatic decision-making, as the\nexact wording may change without notice.\n","example":"Quote expired"},"timestamp":{"type":"string","format":"date-time","description":"The timestamp when the quote was cancelled (ISO-8601 format).","example":"2025-01-15T10:30:00.000000000Z"}},"required":["event_type","iiban","quote_id","reason","timestamp"]},"DepositStatusUpdatedEvent":{"type":"object","description":"Sent when a deposit's status changes. The `event` field indicates the lifecycle\nsub-event: `received` (deposit detected on-chain), `held` (deposit under review),\n`credited` (funds available in the user's account), or `failed` (deposit rejected).\n","properties":{"event_type":{"type":"string","description":"The event type identifier.","enum":["deposit.status_updated"],"example":"deposit.status_updated"},"iiban":{"type":"string","description":"The Internet International Bank Account Number (IIBAN) of the user whose deposit status changed.","example":"AA00 TEST EXAM PLE1"},"event":{"type":"string","description":"The deposit lifecycle sub-event that triggered this webhook.\n- `received` — deposit detected on-chain but not yet credited\n- `held` — deposit is under review (see `reason`)\n- `credited` — funds are now available in the user's account\n- `failed` — deposit was rejected (see `reason`)\n","enum":["received","held","credited","failed"],"example":"credited"},"reason":{"type":"string","description":"Human-readable reason for the status change. Present for `held` and `failed` events.\nThis field is intended for display and logging purposes only. Clients should\nnot rely on specific reason strings for programmatic decision-making, as the\nexact wording may change without notice.\n","example":"aml_check, manual_review"},"amount":{"$ref":"#/components/schemas/AssetAmount","description":"The deposit amount. Present for `credited` events."},"fee":{"$ref":"#/components/schemas/AssetAmount","description":"The deposit fee. Present for `credited` events."},"transaction_id":{"type":"string","description":"The unique identifier for the deposit transaction.","example":"TX62ZZF-ZYY4I-4QBAUW"},"timestamp":{"type":"string","format":"date-time","description":"The timestamp when the status changed (ISO-8601 format).","example":"2025-01-15T10:30:00.000000000Z"}},"required":["event_type","iiban","event","transaction_id","timestamp"]},"WithdrawalStatusUpdatedEvent":{"type":"object","description":"Sent when a withdrawal's status changes.\n\nThe `event` field is the lifecycle sub-event emitted by funding:\n- `received` — withdrawal request accepted and queued\n- `held` — withdrawal is held for review (see `reasons`)\n- `released` — withdrawal released from hold and processing resumes\n- `complete` — withdrawal completed successfully\n- `failed` — withdrawal failed (see `reasons` when provided)\n\nThe `status` field is the partner-facing normalized status used across\npolling APIs (`in_progress`, `held`, `successful`, `failed`).\n","properties":{"event_type":{"type":"string","description":"The event type identifier.","enum":["withdrawal.status_updated"],"example":"withdrawal.status_updated"},"iiban":{"type":"string","description":"The Internet International Bank Account Number (IIBAN) of the user whose withdrawal status changed.","example":"AA00 TEST EXAM PLE1"},"ref_id":{"type":"string","description":"Encrypted funding transaction identifier. This matches `ref_id` returned by withdrawal APIs and transaction polling.","example":"FTT35sk-P9HoywSFWa1VTg1owfSs2n"},"status":{"type":"string","description":"Partner-facing normalized withdrawal status.","enum":["in_progress","held","successful","failed"],"example":"in_progress"},"event":{"type":"string","description":"Withdrawal lifecycle sub-event.","enum":["received","held","released","complete","failed"],"example":"received"},"reasons":{"type":"array","description":"Optional list of reasons associated with held/failed events.","items":{"type":"string"},"example":["aml_check","manual_review"]},"timestamp":{"type":"string","format":"date-time","description":"The timestamp when the status changed (ISO-8601 format).","example":"2026-02-28T12:00:00.000000000Z"}},"required":["event_type","iiban","ref_id","status","event","timestamp"]},"UserVerifiedEvent":{"type":"object","description":"Sent when a user has been verified and can now trade on the platform.","properties":{"event_type":{"type":"string","description":"The event type identifier.","enum":["user.verified"],"example":"user.verified"},"iiban":{"type":"string","description":"The Internet International Bank Account Number (IIBAN) of the verified user.","example":"AA00 TEST EXAM PLE1"},"timestamp":{"type":"string","format":"date-time","description":"The 