{"openapi":"3.0.0","info":{"title":"Embed REST API","version":"2025-04-25","description":"Payward Embed REST API"},"servers":[{"url":"https://nexus.kraken.com","description":"Production Server"}],"security":[{"API-Key":[],"API-Sign":[]}],"tags":[{"name":"Users"},{"name":"Subaccounts"},{"name":"Verifications"},{"name":"Assets"},{"name":"Quotes"},{"name":"Portfolios"},{"name":"Earn"},{"name":"Transfers"},{"name":"Reports"},{"name":"Webhooks","description":"\nWebhooks allow you to receive real-time notifications when events occur in Payward Embed. When you register a webhook, Payward will send HTTP POST requests to your configured URL whenever subscribed events are triggered.\n\n## Getting Started\n\n1. **Make sure your callback domain is allowlisted** before registering a webhook\n2. **Register a webhook** using the Register Webhook endpoint — you can optionally specify `enabled` and `events` at registration time\n3. **Store your secret** - the webhook secret is only returned once during registration\n4. **Enable and subscribe to events** using the Update Webhook endpoint (if not configured at registration)\n5. **Implement signature verification** in your webhook handler — see Webhook Events for details\n\n## Event Types\n\n| Event Type | Description |\n|------------|-------------|\n| `custom_order.executed` | A custom_order has been successfully executed |\n| `custom_order.execution_failed` | A custom_order execution has failed |\n| `custom_order.cancelled` | A custom_order was cancelled |\n| `quote.executed` | A quote has been successfully executed |\n| `quote.execution_failed` | A quote execution has failed |\n| `quote.cancelled` | A quote was cancelled before execution |\n| `deposit.status_updated` | The status of a deposit has been updated |\n| `withdrawal.status_updated` | The status of a withdrawal has been updated |\n| `user.verified` | A user has been verified and can now trade on the platform |\n| `user.closed` | A user's account has been permanently closed |\n| `user.disabled` | A user's account has been disabled (e.g., due to a trade lock or account suspension) |\n| `reward.paid` | An Earn reward has been paid to a user |\n| `webhook.test` | A test event sent via the Test Webhook endpoint |\n\n## Retry Behavior\n\nPayward automatically retries failed webhook deliveries using exponential backoff. The system will continue retrying until the configured timeout is reached:\n\n- **Production**: Retries for up to **5 minutes**\n\nAfter the retry timeout is exceeded, the webhook delivery is marked as failed and no further attempts are made.\n\n## Best Practices\n\n- **Respond quickly** - Return a 2xx status code within 30 seconds to acknowledge receipt\n- **Process asynchronously** - If your processing takes time, queue the webhook for background processing\n- **Be idempotent** - Webhooks may be delivered more than once\n- **Monitor failures** - Track non-2xx responses and implement alerting\n"}],"paths":{"/b2b/assets":{"get":{"operationId":"listEmbedAssets","tags":["Assets"],"summary":"List Assets","description":"List all assets available on the platform.\n\nThis endpoint returns a list of all assets available on the platform. The\nresponse includes the asset identifier, the type of the asset, and the\nstatus of the asset on the platform.\n","parameters":[{"$ref":"#/components/parameters/PaywardVersion"},{"$ref":"#/components/parameters/UserFilter","description":"If provided, filters the list of assets to only include\nthose that can be traded by the user with the given IIBAN.\n"},{"$ref":"#/components/parameters/AssetsFilter","description":"If provided, filters the list of assets to only include\nthose with the given asset IDs.\n"},{"in":"query","name":"filter[platform_statuses][]","description":"If provided, filters the list of assets to only include\nthose with any of the given platform statuses.\n","schema":{"type":"array","default":[],"items":{"$ref":"#/components/schemas/PlatformStatus"}},"style":"form","explode":true},{"in":"query","name":"filter[tradable_only]","description":"If provided and set to `true`, filters the list of assets to only include\nthose that are tradable on the platform.\n\nThis is equivalent to `filter[platform_statuses][]=enabled`\nand is provided as a convenience.\n","schema":{"type":"boolean","default":false}},{"in":"query","name":"sort","schema":{"default":"market_cap_rank","title":"Sort Order","type":"string","enum":["trending","market_cap_rank","-market_cap_rank","symbol","-symbol","name","-name","change_percent_1h","-change_percent_1h","change_percent_24h","-change_percent_24h","change_percent_7d","-change_percent_7d","change_percent_30d","-change_percent_30d","change_percent_1y","-change_percent_1y","listing_date","-listing_date"]}},{"$ref":"#/components/parameters/PageSize"},{"$ref":"#/components/parameters/PageNumber"},{"$ref":"#/components/parameters/Quote"},{"$ref":"#/components/parameters/Lang"}],"responses":{"200":{"description":"Response","content":{"application/json":{"schema":{"type":"object","properties":{"result":{"type":"object","properties":{"assets":{"description":"The list of matching assets.","type":"array","items":{"type":"object","properties":{"id":{"description":"The asset identifier.","$ref":"#/components/schemas/AssetName"},"disabled_against":{"type":"array","items":{"$ref":"#/components/schemas/AssetName"},"description":"If a user IIBAN was provided in the request, this field\nwill contain a list of assets that can't be paired\nwith this asset.\n"},"decimals":{"description":"The maximum number of decimals that can be used for this asset.\n","$ref":"#/components/schemas/Uint8"},"display_decimals":{"description":"The number of decimals to display for this asset.\n","$ref":"#/components/schemas/Uint8"},"collateral_value":{"description":"Valuation as margin collateral (if applicable).\n","type":"number","format":"float"},"user_status":{"description":"If a user id was provided in the request,\nthis field will contain the status of the asset for\nthe given user.\n","anyOf":[{"title":"Known User Status","type":"string","enum":["tradable","available_soon","temporarily_disabled","disabled"]},{"title":"Unknown User Status","type":"string"}]},"simple_trade_decimals":{"$ref":"#/components/schemas/Uint8"},"platform_status":{"$ref":"#/components/schemas/PlatformStatus"},"english_name":{"$ref":"#/components/schemas/EnglishName"},"circulating_supply":{"$ref":"#/components/schemas/BigDecimal"},"circulating_supply_value":{"$ref":"#/components/schemas/BigDecimal"},"total_supply":{"$ref":"#/components/schemas/TotalSupply"},"total_supply_value":{"$ref":"#/components/schemas/BigDecimal","description":"The value of the total number of tokens that currently\nexist, in the `quote` asset provided in the request.\n"},"max_supply":{"$ref":"#/components/schemas/MaxSupply"},"max_supply_value":{"$ref":"#/components/schemas/BigDecimal","description":"The value of the maximum number of tokens that can ever\nexist, in the `quote` asset provided in the request.\n"},"price":{"$ref":"#/components/schemas/BigDecimal","description":"The latest price of the asset, in the `quote` asset\nprovided in the request.\n"},"trending_rank":{"$ref":"#/components/schemas/Uint32","description":"The trending rank of the asset compared to all other\ntrending assets.\n"},"market_cap_rank":{"$ref":"#/components/schemas/Uint32","description":"The rank of the asset based on the total market cap value.\n"},"market_cap_value":{"$ref":"#/components/schemas/MarketCapValue"},"dominance_percent":{"$ref":"#/components/schemas/Percentage","description":"The market cap dominance percentage.\n"},"change_percent_1h":{"$ref":"#/components/schemas/Percentage","description":"The price change percentage over the last 1 hour.\n"},"change_percent_24h":{"$ref":"#/components/schemas/Percentage","description":"The price change percentage over the last 24 hours.\n"},"change_percent_7d":{"$ref":"#/components/schemas/Percentage","description":"The price change percentage over the last 7 days.\n"},"change_percent_30d":{"$ref":"#/components/schemas/Percentage","description":"The price change percentage over the last 30 days.\n"},"change_percent_1y":{"$ref":"#/components/schemas/Percentage","description":"The price change percentage over the last 1 year.\n"},"volume_value_24h":{"$ref":"#/components/schemas/BigDecimal","description":"The trading volume for the asset, in the `quote` asset\nprovided in the request.\n"},"listing_date":{"$ref":"#/components/schemas/Date","description":"The date the asset was first listed on Payward.\n"},"ath_value":{"$ref":"#/components/schemas/AthValue"},"ath_date":{"$ref":"#/components/schemas/AthDate"},"links":{"type":"object","properties":{"self":{"type":"object","properties":{"href":{"type":"string"},"type":{"nullable":true,"type":"string"}},"required":["href"]},"logo":{"$ref":"#/components/schemas/Logo"}},"required":["logo","self"]}},"required":["decimals","disabled_against","display_decimals","id","links","platform_status"]}},"links":{"type":"object","properties":{"self":{"$ref":"#/components/schemas/Uri"},"first":{"$ref":"#/components/schemas/Uri"},"last":{"$ref":"#/components/schemas/Uri"},"prev":{"$ref":"#/components/schemas/Uri"},"next":{"$ref":"#/components/schemas/Uri"}}},"meta":{"type":"object","properties":{"total_items":{"$ref":"#/components/schemas/Uint32"},"total_pages":{"$ref":"#/components/schemas/Uint32"},"page_size":{"$ref":"#/components/schemas/PageSize"},"page_number":{"$ref":"#/components/schemas/PageNumber"}}}},"required":["assets","links","meta"]}}}}}},"400":{"$ref":"#/components/responses/BadRequestError"},"401":{"$ref":"#/components/responses/UnauthorizedError"},"403":{"$ref":"#/components/responses/ForbiddenError"},"404":{"$ref":"#/components/responses/NotFoundError"},"408":{"$ref":"#/components/responses/RequestTimeoutError"},"409":{"$ref":"#/components/responses/ConflictError"},"429":{"$ref":"#/components/responses/RateLimitError"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailableError"}}}},"/b2b/assets/{asset}":{"get":{"operationId":"getEmbedAsset","summary":"Get Asset","tags":["Assets"],"description":"Get information about a specific asset.\n","parameters":[{"$ref":"#/components/parameters/PaywardVersion"},{"$ref":"#/components/parameters/AssetPath"},{"$ref":"#/components/parameters/Quote"},{"$ref":"#/components/parameters/Lang"}],"responses":{"200":{"description":"Response","content":{"application/json":{"schema":{"type":"object","properties":{"result":{"type":"object","properties":{"symbol":{"$ref":"#/components/schemas/AssetName"},"english_name":{"$ref":"#/components/schemas/EnglishName"},"description":{"type":"string"},"bearish_insights":{"type":"string"},"bullish_insights":{"type":"string"},"circulating_supply":{"$ref":"#/components/schemas/BigDecimal"},"total_supply":{"$ref":"#/components/schemas/BigDecimal"},"max_supply":{"$ref":"#/components/schemas/BigDecimal"},"market_cap_value":{"$ref":"#/components/schemas/BigDecimal"},"dominance_percent":{"$ref":"#/components/schemas/Percentage","description":"The market cap dominance percentage.\n"},"market_cap_rank":{"$ref":"#/components/schemas/Uint32","description":"The rank of the asset based on the total market cap value.\n"},"change_value_24h":{"$ref":"#/components/schemas/BigDecimal"},"change_percent_24h":{"$ref":"#/components/schemas/Percentage"},"volume_value_24h":{"$ref":"#/components/schemas/BigDecimal"},"ath_value":{"$ref":"#/components/schemas/AthValue"},"ath_date":{"$ref":"#/components/schemas/AthDate"},"links":{"type":"object","properties":{"self":{"type":"object","properties":{"href":{"type":"string"},"type":{"nullable":true,"type":"string"}},"required":["href"]},"logo":{"$ref":"#/components/schemas/Logo"}},"required":["logo","self"]}},"required":["english_name","links","symbol"]}}}}}},"400":{"description":"Bad Request. Error codes:\n- `ENexus:Unknown quote asset` — not retryable\n","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"},"example":{"errors":[{"status":"400","code":"ENexus:Unknown quote asset","detail":null}],"result":null}}}},"401":{"$ref":"#/components/responses/UnauthorizedError"},"403":{"$ref":"#/components/responses/ForbiddenError"},"404":{"$ref":"#/components/responses/NotFoundError"},"408":{"$ref":"#/components/responses/RequestTimeoutError"},"409":{"$ref":"#/components/responses/ConflictError"},"429":{"$ref":"#/components/responses/RateLimitError"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailableError"}}}},"/b2b/assets/{asset}/rates":{"get":{"operationId":"listEmbedAssetRates","summary":"List Asset Rates","tags":["Assets"],"description":"Returns historical rates for a given asset.\n\nThis endpoint returns historical rates for a given asset. The response\nincludes the timestamp for the period the rate is for and the median price\nof the asset during the period (daily).\n","parameters":[{"$ref":"#/components/parameters/PaywardVersion"},{"$ref":"#/components/parameters/AssetPath"},{"$ref":"#/components/parameters/Quote"},{"in":"query","name":"start_time","description":"A RFC 3339 datetime","deprecated":false,"example":"2025-06-30T00:00:00.000Z","schema":{"type":"string","format":"date-time","nullable":true},"style":"form","allowEmptyValue":true},{"in":"query","name":"end_time","description":"A RFC 3339 datetime","deprecated":false,"example":"2025-06-30T00:00:00.000Z","schema":{"type":"string","format":"date-time","nullable":true},"style":"form","allowEmptyValue":true},{"in":"query","name":"interval","description":"If provided, shows the history of the asset in the given interval.\n\nShould be in the format of an [ISO 8601 duration].\n\nSupported resolutions: 1min, 5min, 15min, 30min, 60min, 4H, 1D, 7D, 15D\n","deprecated":false,"example":"PT15M","schema":{"type":"string","format":"duration","nullable":true},"style":"form","allowEmptyValue":true}],"responses":{"200":{"description":"Response","content":{"application/json":{"schema":{"type":"object","properties":{"result":{"type":"object","properties":{"rates":{"description":"List of historical records","type":"array","items":{"$ref":"#/components/schemas/PriceTick"}},"meta":{"type":"object","properties":{"page_oldest_rate":{"$ref":"#/components/schemas/PriceTick"},"page_newest_rate":{"$ref":"#/components/schemas/PriceTick"},"page_price_change_value":{"$ref":"#/components/schemas/BigDecimal"},"page_price_change_percent":{"$ref":"#/components/schemas/Percentage"}}}},"required":["meta","rates"]}}}}}},"400":{"description":"Bad Request. Error codes:\n- `ENexus:Unknown base asset` — not retryable\n- `ENexus:Unknown quote asset` — not retryable\n- `ENexus:Interval is too large` — not retryable\n- `ENexus:Invalid start time` — not retryable\n- `ENexus:Invalid end time` — not retryable\n","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"},"examples":{"unknown_base_asset":{"summary":"Unknown base asset","value":{"errors":[{"status":"400","code":"ENexus:Unknown base asset","detail":null}],"result":null}},"interval_too_large":{"summary":"Interval is too large","value":{"errors":[{"status":"400","code":"ENexus:Interval is too large","detail":null}],"result":null}}}}}},"401":{"$ref":"#/components/responses/UnauthorizedError"},"403":{"$ref":"#/components/responses/ForbiddenError"},"404":{"$ref":"#/components/responses/NotFoundError"},"408":{"$ref":"#/components/responses/RequestTimeoutError"},"409":{"$ref":"#/components/responses/ConflictError"},"429":{"$ref":"#/components/responses/RateLimitError"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailableError"}}}},"/b2b/earn/{user}":{"get":{"operationId":"getEmbedEarnSummary","tags":["Earn"],"summary":"Get Earn Summary","description":"Get Earn summary of a user.\n\nModifiers: user-preferred currency (quote).\n\nResponse holds total amounts (all-time). For per-asset granularity, use\n`GET /b2b/earn/assets`.\n\nDepending on the reward asset and user-preferred currency, amounts in the\nresponse can be zero, eg. \"0.00000000\" BTC. It's the caller's responsibility to handle such cases, eg by showing amounts as \"<0.000000001\" or \"~0\".\n","parameters":[{"$ref":"#/components/parameters/PaywardVersion"},{"$ref":"#/components/parameters/UserPath"},{"in":"query","name":"currency","deprecated":false,"description":"The user-preferred currency.","schema":{"nullable":false,"type":"string","maxLength":16},"style":"form","allowEmptyValue":false}],"responses":{"200":{"description":"Response","content":{"application/json":{"schema":{"type":"object","properties":{"result":{"type":"object","properties":{"auto_earn_eligible":{"description":"Whether the user is eligible for Auto-Earn","type":"boolean"},"auto_earn_enabled":{"description":"Whether there is currently at least one Earn allocation active for the user","type":"boolean"},"auto_earn_last_changed":{"nullable":true,"description":"When the Auto-Earn feature has last been turned on or off.","type":"string","format":"date-time"},"payout_period":{"example":"PT15M","description":"Payout period of all Auto-Earn rewards.","type":"string"},"total_allocated_converted":{"example":"1.23","description":"Total allocated by the user. Denominated in requested `quote`.","type":"string","pattern":"^-?[0-9]+(\\.[0-9]+)?$","minLength":1,"maxLength":64},"total_rewarded_converted_true_rates":{"example":"1.23","description":"Total rewards accrued by the user, using \"sum of individually converted amounts\". This means \"true\" historic conversion rates at the times the payouts happened, are used.\n\nThe resulting sum is also referred to as \"never-decreasing amount\". Also, see `total_rewarded_converted_current_rate`.","type":"string","pattern":"^-?[0-9]+(\\.[0-9]+)?$","minLength":1,"maxLength":64},"total_rewarded_converted_current_rate":{"example":"1.23","description":"Total rewards accrued by the user, using \"converted total of native amounts\". This means the current day conversion rate is used to convert the sum of native amounts.\n\nUnlike `total_rewarded_converted_true_rates`, this summing strategy can yield \"decreasing amounts\". If the native asset appreciates relative to the requested currency, the total reward in currency may decrease even though native rewards have increased.","type":"string","pattern":"^-?[0-9]+(\\.[0-9]+)?$","minLength":1,"maxLength":64},"num_earning_assets":{"description":"Number of active allocations, which under Auto-Earn is the same as number of earning assets.","type":"integer","format":"uint32","minimum":0},"upcoming_rewards":{"description":"Upcoming rewards.\n\nIncludes an entry for each earning asset.","type":"array","items":{"description":"Earn event.\n\nCurrently, only events of type `Reward` are supported.","properties":{"date":{"description":"Date of the payout.","type":"string","format":"date-time"},"asset":{"description":"Asset of the payout.","type":"string","maxLength":16},"accumulated_amount":{"description":"Accumulated amount until now. Denominated in native and requested `currency`.","type":"object","properties":{"native":{"example":"1.23","description":"Amount in the native asset","type":"string","pattern":"^-?[0-9]+(\\.[0-9]+)?$","minLength":1,"maxLength":64},"converted":{"example":"1.23","description":"Amount converted into the user-preferred currency","type":"string","pattern":"^-?[0-9]+(\\.[0-9]+)?$","minLength":1,"maxLength":64}},"required":["converted","native"]},"estimated_pending_amount":{"nullable":true,"description":"Estimated pending amount from now until payout on payout `date`. Denominated in native and requested `currency`. Set to None if `date` is in the past, meaning `accumulated_amount` is the final reward amount and no pending amount is outstanding.","type":"object","properties":{"native":{"example":"1.23","description":"Amount in the native asset","type":"string","pattern":"^-?[0-9]+(\\.[0-9]+)?$","minLength":1,"maxLength":64},"converted":{"example":"1.23","description":"Amount converted into the user-preferred currency","type":"string","pattern":"^-?[0-9]+(\\.[0-9]+)?$","minLength":1,"maxLength":64}},"required":["converted","native"]}},"required":["accumulated_amount","asset","date"]}}},"required":["auto_earn_eligible","auto_earn_enabled","num_earning_assets","payout_period","total_allocated_converted","total_rewarded_converted_current_rate","total_rewarded_converted_true_rates","upcoming_rewards"]}}}}}},"400":{"$ref":"#/components/responses/BadRequestError"},"401":{"$ref":"#/components/responses/UnauthorizedError"},"403":{"$ref":"#/components/responses/ForbiddenError"},"404":{"$ref":"#/components/responses/NotFoundError"},"408":{"$ref":"#/components/responses/RequestTimeoutError"},"409":{"$ref":"#/components/responses/ConflictError"},"429":{"$ref":"#/components/responses/RateLimitError"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailableError"}}}},"/b2b/earn/assets":{"get":{"operationId":"listEmbedEarnAssets","tags":["Earn"],"summary":"List Earn Assets","description":"List Earn Assets.\n\nFilters: by asset/s, by user.\nModifiers: user-preferred currency (quote).\n\nThe user can optionally be passed in the request, which shows active asset\nallocations of the user in the response.\n","parameters":[{"$ref":"#/components/parameters/PaywardVersion"},{"in":"query","name":"assets","deprecated":false,"description":"Filter specific assets by asset name. Empty filter returns all assets.","schema":{"default":[],"type":"array","items":{"type":"string","maxLength":16}},"style":"form","allowEmptyValue":false},{"in":"query","name":"user","deprecated":false,"description":"Filter assets by a specific user. Setting the user has two\neffects:\n\n1. Active non-zero per-asset allocations of the user are included\nin the response\n2. The list of returned assets is filtered by the user's\ncountry/eligibility.\n","schema":{"nullable":true,"type":"string","minLength":14,"maxLength":42},"example":"AA07 N84G DLNK DA3I","style":"form"},{"in":"query","name":"currency","deprecated":false,"description":"The user-preferred currency. This field is ignored if `user` is not set, and it must be set if `user` is set.","schema":{"nullable":true,"type":"string","maxLength":16},"style":"form","allowEmptyValue":true}],"responses":{"200":{"description":"Response","content":{"application/json":{"schema":{"type":"object","properties":{"result":{"type":"object","properties":{"assets":{"description":"All assets that can yield rewards.","type":"object","additionalProperties":{"description":"Earn Asset\n\nA single asset that can yield rewards.\n\nField `apr_estimate` is expected to be always set, independent of a user's Auto-Earn status.\n\nNote: APR estimates may not be returned in edge cases where a user enables Auto-Earn in one country and then moves to another country where some auto-earning assets are unavailable. In such cases, the user may still auto-earn these assets but without APR estimates. To resolve this, users can disable and re-enable Auto-Earn, which will respect the country change by only enabling Auto-Earn for assets available in the new country.","type":"object","properties":{"apr_estimate":{"type":"object","description":"low and high estimate of the yield of this Earn asset.","properties":{"low":{"$ref":"#/components/schemas/BigDecimal","description":"Minimal expected yield percentage for one year"},"high":{"$ref":"#/components/schemas/BigDecimal","description":"Maximal expected yield percentage for one year"}},"required":["high","low"]},"user_allocation":{"nullable":true,"description":"User allocation for this asset.","type":"object","properties":{"total_rewarded":{"description":"Total rewards accrued by the user (excl. fees). Holds native amount and amount denominated in user-preferred `currency`.","type":"object","properties":{"native":{"$ref":"#/components/schemas/BigDecimal","description":"Amount in the native asset"},"converted":{"$ref":"#/components/schemas/BigDecimal","description":"Amount converted into the user-preferred currency"}},"required":["converted","native"]},"total_allocated":{"description":"Total allocated by the user. Holds native amount and amount denominated in user-preferred `currency`.","type":"object","properties":{"native":{"$ref":"#/components/schemas/BigDecimal","description":"Amount in the native asset"},"converted":{"$ref":"#/components/schemas/BigDecimal","description":"Amount converted into the user-preferred currency"}},"required":["converted","native"]},"upcoming_reward_date":{"$ref":"#/components/schemas/Date","description":"Upcoming reward date."}}}}}}},"required":["assets"]}}}}}},"400":{"$ref":"#/components/responses/BadRequestError"},"401":{"$ref":"#/components/responses/UnauthorizedError"},"403":{"$ref":"#/components/responses/ForbiddenError"},"404":{"$ref":"#/components/responses/NotFoundError"},"408":{"$ref":"#/components/responses/RequestTimeoutError"},"409":{"$ref":"#/components/responses/ConflictError"},"429":{"$ref":"#/components/responses/RateLimitError"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailableError"}}}},"/b2b/earn/{user}/auto":{"put":{"operationId":"toggleEmbedAutoEarn","summary":"Toggle Auto-Earn","tags":["Earn"],"description":"Toggle Auto-Earn of a user.\n\nToggling Auto-Earn is an async operation, which is triggered by calling this\nendpoint. Therefore, the response is empty.\n\nTo fetch the users current Auto-Earn status, use `GET /b2b/earn/{user}`.\n","parameters":[{"$ref":"#/components/parameters/PaywardVersion"},{"$ref":"#/components/parameters/UserPath","description":"User to toggle the Auto-Earn status for"},{"in":"query","name":"want_enabled","description":"Whether to enable or disable Auto-Earn","required":true,"schema":{"type":"boolean"}}],"responses":{"200":{"description":"Successful response indicat