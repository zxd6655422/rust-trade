                        description: 事件类型
                      E:
                        type: integer
                        format: int64
                        example: 1693907033000
                        description: 事件时间
                      s:
                        type: string
                        example: BTCUSDT
                        description: 交易对
                      i:
                        type: string
                        example: 5m
                        description: 平均价格间隔
                      w:
                        type: string
                        example: 25776.86
                        description: 平均价格
                      T:
                        type: integer
                        format: int64
