        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/api/general/ExchangeInfoExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketapi/GeneralAPI/ExchangeInfo/ExchangeInfo.go
      x-ip-weight: 20
      x-security-type: NONE
      x-parameters-notes: |-
        **数据源:** 缓存

        **备注:**
        * 如果参数 `symbol` 或者 `symbols` 提供的交易对不存在, 系统会返回错误并提示交易对不正确。
        * 所有的参数都是可选的。
        * `symbol`、`symbols`、`permissions` 参数只能指定其中一个。
        * 不带参数时, `exchangeInfo` 显示所有具有 `["SPOT", "MARGIN", "LEVERAGED"]` 权限的交易对。
          * 要列出交易所上所有活跃的交易对, 您需要在 `permissions` 中明确指定它们。
        * `permissions` 可以支持单个或多个值（例如 `"SPOT"`, `["MARGIN","LEVERAGED"]`）。

        **解释响应中的 `permissionSets`：**

        * `[["A","B"]]` 有权限"A"**或**权限"B"的账户可以下订单。
        * `[["A"],["B"]]` 有权限"A"**和**权限"B"的账户可以下订单。
        * `[["A"],["B","C"]]` 有权限"A"**和**权限"B"或权限"C"的账户可以下订单。（此处应用的是包含或，而不是排除或，因此账户可以同时拥有权限"B"和权限"C"。）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: 客户端生成的请求标识符。
                  example: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - exchangeInfo
                  example: exchangeInfo
                params:
                  type: object
                  properties:
                    symbol:
                      type: string
                      example: BNBUSDT
                      description: 描述单个交易对
                    symbols:
                      type: array
                      items:
                        type: string
                        example: BTCUSDT
                      description: 描述多个交易对
                    permissions:
                      type: array
                      items:
                        type: string
                        example: SPOT
                      description: 按权限过滤交易对
                    showPermissionSets:
                      type: boolean
                      example: true
                      default: true
                      description: 控制 `permissionSets` 字段的内容是否填充。默认为 `true`。
                    symbolStatus:
                      type: string
                      enum:
                        - TRADING
                        - HALT
                        - BREAK
                      example: TRADING
                      description: 过滤具有此 `tradingStatus` 的交易对。有效值：`TRADING`, `HALT`, `BREAK`。不能与 `symbol` 或 `symbols` 组合使用。
                  additionalProperties: false
              required:
                - id
                - method
              additionalProperties: false
            example:
              id: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
              method: exchangeInfo
              params:
                symbol: BNBUSDT
                symbols:
                  - BTCUSDT
                permissions:
                  - SPOT
                showPermissionSets: true
                symbolStatus: TRADING
      responses:
        Successful Response:
          description: 交易规范信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 5494febb-d167-46a2-996d-70533eb4d976
                  status:
                    type: integer
                    format: int64
                    example: 200
                  result:
                    $ref: '#/components/schemas/exchangeInfoResponse'
