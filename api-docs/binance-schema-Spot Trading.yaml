                    - TAKE_PROFIT
                    - TAKE_PROFIT_LIMIT
                  example: STOP_LOSS
                  description: 支持的数值： `STOP_LOSS`, `STOP_LOSS_LIMIT`, `TAKE_PROFIT`, `TAKE_PROFIT_LIMIT`
                pendingBelowClientOrderId:
