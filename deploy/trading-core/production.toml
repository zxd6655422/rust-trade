# =================================================================
# Trading Core 生产环境配置
# 数据采集 + 回填 + API 服务
# =================================================================

# 日志等级: trace, debug, info, warn, error
log_level = "info"

# 监控的交易对列表
symbols = [
    "BTCUSDT", "ETHUSDT", "SOLUSDT", "SUIUSDT", "BNBUSDT",
    "HYPEUSDT", "SPCXUSDT", "TSLAUSDT", "NVDAUSDT","AAOIUSDT", "MUUSDT", "SKHYNIXUSDT"
]

# 只有合约的交易对（使用 /fapi/v1/klines 而非 /api/v3/klines）
futures_symbols = [
    "HYPEUSDT", "SPCXUSDT", "TSLAUSDT", "NVDAUSDT","AAOIUSDT", "MUUSDT", "SKHYNIXUSDT"
]

# =================================================================
# 服务器配置
# =================================================================
[server]
host = "0.0.0.0"
port = 8080

# =================================================================
# 数据库配置
# =================================================================
[database]
# 从环境变量 DATABASE_URL 加载
max_connections = 10
min_connections = 2
max_lifetime = 1800

# =================================================================
# 缓存配置
# =================================================================
[cache]

[cache.memory]
max_ticks_per_symbol = 2000
ttl_seconds = 600

[cache.redis]
# 从环境变量 REDIS_URL 加载
pool_size = 20
ttl_seconds = 7200
max_ticks_per_symbol = 20000

# =================================================================
# 模拟交易配置
# =================================================================
[paper_trading]
enabled = false
strategy = "rsi"
initial_capital = 50000.0

# =================================================================
# 数据采集配置
# =================================================================
[collector]
# 采集模式: "disabled" / "tick" / "candle1m"
# - disabled: 禁用数据采集（仅回测）
# - tick: 采集 tick 数据（高频，资源消耗大）
# - candle1m: 采集 1m candle 数据（低频，推荐）
mode = "candle1m"

# 是否同时启用 tick 采集（用于高频分析）
enable_tick = false

# 轮询间隔（秒），仅对 candle1m 模式有效
poll_interval_secs = 10

# =================================================================
# 历史数据回填配置
# =================================================================

# 启用历史数据回填（首次启动执行）
backfill_enabled = true

# 回填起始日期，格式 "YYYY-MM-DD"
backfill_start_date = "2017-09-01"

# =================================================================
# 多时间框架配置（新增）
# =================================================================

# 需要存储的时间框架列表
# 数据会从交易所直接拉取并存储到对应的数据库表
stored_timeframes = [
    "1m",   # 基础数据源，2周缓存
    "5m",   # 短线策略，1个月缓存
    "15m",  # 日内策略，1个月缓存
    "30m",  # 日内波段，1个月缓存
    "1h",   # 波段策略，6个月缓存
    "2h",   # 中线策略，6个月缓存
    "4h",   # 中线策略，6个月缓存
    "1d",   # 长线策略，5年缓存
    "3d",   # 大周期分析，5年缓存
    "1w",   # 宏观分析，10年缓存
]

# 启用多时间框架回填
# 首次启动会回填所有时间框架的历史数据
# 后续启动会执行增量回填
multi_tf_backfill_enabled = true

# 增量回填间隔（小时）
# 每隔多久检查并补齐缺失的高时间框架数据
multi_tf_backfill_interval_hours = 6

# =================================================================
# 限速配置
# =================================================================
[collector.rate_limit]

# Backfill 每个请求间隔 (ms)
# Binance: 20 req/s, OKX: 12 req/s
# 300ms ≈ 3.3 req/s per symbol（安全）
backfill_interval_ms = 1000

# 最大并发 backfill 数量
# 3 并发 × 3.3 req/s ≈ 10 req/s（远低于限制）
max_concurrent_backfills = 3

# 轮询批次大小
poll_batch_size = 5

# 轮询批次间延迟 (ms)
poll_batch_delay_ms = 500

# =================================================================
# 策略分析调度器配置
# =================================================================
[strategy]

# 分析间隔（秒），默认 300（5分钟）
interval_secs = 300

# 信号过期时间（小时），默认 24
signal_max_age_hours = 24

# 确认阈值 - 收益率% 达到此值确认信号（默认 0.5）
confirm_threshold_pct = 0.5

# 止损阈值 - 亏损% 触发止损（默认 -2.0）
stop_loss_pct = -2.0

# 止盈阈值 - 收益率% 触发止盈（默认 3.0）
take_profit_pct = 3.0
