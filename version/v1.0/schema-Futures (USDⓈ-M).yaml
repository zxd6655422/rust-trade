  /fapi/v1/countdownCancelAll:
    post:
      summary: 倒计时撤销所有订单
      description: |-
        * 该接口可以被用于确保在倒计时结束时撤销指定symbol上的所有挂单。 在使用这个功能时，接口应像心跳一样在倒计时内被反复调用，以便可以取消既有的倒计时并开始新的倒数计时设置。

        * 用法示例：
        以30s的间隔重复此接口，每次倒计时countdownTime设置为120000(120s)。
        如果在120秒内未再次调用此接口，则您指定symbol上的所有挂单都会被自动撤销。
        如果在120秒内以将countdownTime设置为0，则倒数计时器将终止，自动撤单功能取消。

        * 系统会**大约每10毫秒**检查一次所有倒计时情况，因此请注意，使用此功能时应考虑足够的冗余。
        我们不建议将倒记时设置得太精确或太小。
      tags:
        - trade
      operationId: autoCancelAllOpenOrders
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/rest-api/trade#auto-cancel-all-open-orders
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/rest-api/TradeApi/autoCancelAllOpenOrders.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/rest_api/trade_api/auto_cancel_all_open_orders.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/rest_api/Trade/auto_cancel_all_open_orders.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/rest/trade/AutoCancelAllOpenOrdersExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/restapi/TradeAPI/AutoCancelAllOpenOrders/AutoCancelAllOpenOrders.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-usds-futures/trade/AutoCancelAllOpenOrdersExample.php
      x-ip-weight: 10
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - symbol
                - countdownTime
                - timestamp
              properties:
                symbol:
                  type: string
                  example: BTCUSDT
                countdownTime:
                  type: integer
                  example: 1000
                  format: int64
                  description: 倒计时。 1000 表示 1 秒； 0 表示取消倒计时撤单功能。
                recvWindow:
                  type: integer
                  example: 5000
                  maximum: 60000
                  format: int64
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: Auto-取消All 未完成订单
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    example: BTCUSDT
                  countdownTime:
                    type: string
                    example: '100000'
