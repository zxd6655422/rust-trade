openapi: 3.0.2
info:
  title: Spot REST API
  description: 访问市场数据、管理账户，并在 Binance 现货市场交易。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: rest-api
x-rate-limits-guide: products/spot/rest-api#访问限制
x-security-guide: products/spot/rest-api#请求鉴权类型
x-api-key-guide: https://www.binance.com/cn/support/faq/detail/360002502072
externalDocs:
  description: Spot docs
  url: https://developers.binance.com/en/docs/products/spot
tags:
  - name: general
    x-displayName: 通用
  - name: market
    x-displayName: 行情
  - name: trade
    x-displayName: 交易
  - name: account
    x-displayName: 账户
servers:
  - url: https://api.binance.com
  - url: https://api-gcp.binance.com
  - url: https://api1.binance.com
  - url: https://api2.binance.com
  - url: https://api3.binance.com
  - url: https://api4.binance.com
  - url: https://data-api.binance.vision
  - url: https://testnet.binance.vision
  - url: https://api1.testnet.binance.vision
paths:
  /api/v3/account/commission:
    get:
      summary: 查询佣金费率
      description: 获取当前账户的佣金费率。
      tags:
        - account
      operationId: accountCommission
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/rest-api/account#account-commission
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/rest-api/AccountApi/accountCommission.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/rest_api/account_api/account_commission.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/rest_api/Account/account_commission.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/rest/account/AccountCommissionExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/restapi/AccountAPI/AccountCommission/AccountCommission.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/spot/account/AccountCommissionExample.php
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: '**数据源:** 数据库'
      responses:
        '200':
          description: 查询佣金费率
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    example: BTCUSDT
                  standardCommission:
                    type: object
                    properties:
                      maker:
                        type: string
                        example: '0.00000010'
                      taker:
                        type: string
                        example: '0.00000020'
                      buyer:
                        type: string
                        example: '0.00000030'
                      seller:
                        type: string
                        example: '0.00000040'
                    description: 订单交易的标准佣金率。
                  specialCommission:
                    type: object
                    properties:
                      maker:
                        type: string
                        example: '0.01000000'
                      taker:
                        type: string
                        example: '0.02000000'
                      buyer:
                        type: string
                        example: '0.03000000'
                      seller:
                        type: string
                        example: '0.04000000'
                    description: 订单交易的特殊佣金率。
                  taxCommission:
                    type: object
                    properties:
                      maker:
                        type: string
                        example: '0.00000112'
                      taker:
                        type: string
                        example: '0.00000114'
                      buyer:
                        type: string
                        example: '0.00000118'
                      seller:
                        type: string
                        example: '0.00000116'
                    description: 订单交易的税率。
                  discount:
                    type: object
                    properties:
                      enabledForAccount:
                        type: boolean
                        example: true
                      enabledForSymbol:
                        type: boolean
                        example: true
                      discountAsset:
                        type: string
                        example: BNB
                      discount:
                        type: string
                        example: '0.75000000'
                        description: 当用BNB支付佣金时，在标准佣金上按此比率打折
                    description: 使用BNB支付时的佣金折扣。
  /api/v3/allOrderList:
    get:
      summary: 查询所有订单列表
      description: |-
        根据提供的可选参数检索所有的订单列表。

        请注意，`startTime`和`endTime`之间的时间不能超过 24 小时。
      tags:
        - account
      operationId: allOrderList
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/rest-api/account#all-order-list
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/rest-api/AccountApi/allOrderList.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/rest_api/account_api/all_order_list.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/rest_api/Account/all_order_list.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/rest/account/AllOrderListExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/restapi/AccountAPI/AllOrderList/AllOrderList.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/spot/account/AllOrderListExample.php
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
        - name: fromId
          in: query
          required: false
          description: 提供该项后, startTime 和 endTime 都不可提供
          schema:
            type: integer
            format: int64
            example: 1
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            example: 1735693200000
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            example: 1735693200000
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 1
            default: 500
            maximum: 1000
        - name: recvWindow
          in: query
          required: false
          description: 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
          schema:
            type: number
            format: float
            example: 5000
            maximum: 60000
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: '**数据源**: 数据库'
      responses:
        '200':
          description: 查询所有订单列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    orderListId:
                      type: integer
                      format: int64
                      example: 29
                    contingencyType:
                      type: string
                      example: OCO
                    listStatusType:
                      type: string
                      example: EXEC_STARTED
                    listOrderStatus:
                      type: string
                      example: EXECUTING
                    listClientOrderId:
                      type: string
                      example: amEEAXryFzFwYF1FeRpUoZ
                    transactionTime:
                      type: integer
                      format: int64
                      example: 1565245913483
                    symbol:
                      type: string
                      example: LTCBTC
                    orders:
                      type: array
                      items:
                        type: object
                        properties:
                          symbol:
                            type: string
                            example: LTCBTC
                          orderId:
                            type: integer
                            format: int64
                            example: 4
                          clientOrderId:
                            type: string
                            example: oD7aesZqjEGlZrbtRpy5zB
  /api/v3/allOrders:
    get:
      summary: All 订单
      description: 获取all 账户 订单; active, canceled, 或 filled.
      tags:
        - account
      operationId: allOrders
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/rest-api/account#all-orders
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/rest-api/AccountApi/allOrders.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/rest_api/account_api/all_orders.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/rest_api/Account/all_orders.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/rest/account/AllOrdersExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/restapi/AccountAPI/AllOrders/AllOrders.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/spot/account/AllOrdersExample.php
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: LTCBTC
        - name: orderId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            example: 1
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            example: 1735693200000
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            example: 1735693200000
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 1
            default: 500
            maximum: 1000
        - name: recvWindow
          in: query
          required: false
          description: 最大值为 `60000` 毫秒。 <br> 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
          schema:
            type: number
            format: float
            example: 5000
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: |-
        **数据源**: 数据库

        - **注意:** * 如设置 `orderId` , 订单量将 >= `orderId`。否则将返回最新订单。
        - 一些历史订单 `cummulativeQuoteQty` < 0, 是指数据此时不存在。
        - 如果设置 `startTime` 和 `endTime`, `orderId` 就不需要设置。
        - `startTime`和`endTime`之间的时间不能超过 24 小时。 **数据源:** 数据库
      responses:
        '200':
          description: All 订单
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                      example: LTCBTC
                    orderId:
                      type: integer
                      format: int64
                      example: 1
                    orderListId:
                      type: integer
                      format: int64
                      example: -1
                      description: 除非此单是订单列表的一部分, 否则此值为 -1
                    clientOrderId:
                      type: string
                      example: myOrder1
                    price:
                      type: string
                      example: '0.1'
                    origQty:
                      type: string
                      example: '1.0'
                    executedQty:
                      type: string
                      example: '0.0'
                    cummulativeQuoteQty:
                      type: string
                      example: '0.0'
                    status:
                      type: string
                      example: NEW
                    timeInForce:
                      type: string
                      example: GTC
                    type:
                      type: string
                      example: LIMIT
                    side:
                      type: string
                      example: BUY
                    stopPrice:
                      type: string
                      example: '0.00000000'
                      description: 出现在 STOP_LOSS, TAKE_PROFIT, STOP_LOSS_LIMIT 和 TAKE_PROFIT_LIMIT 订单中。
                    icebergQty:
                      type: string
                      example: '0.00000000'
                      description: 仅在请求中发送了 icebergQty 参数时出现。
                    time:
                      type: integer
                      format: int64
                      example: 1499827319559
                    updateTime:
                      type: integer
                      format: int64
                      example: 1499827319559
                    isWorking:
                      type: boolean
                      example: true
                    origQuoteOrderQty:
                      type: string
                      example: '0.000000'
                    workingTime:
                      type: integer
                      format: int64
                      example: 1499827319559
                    selfTradePreventionMode:
                      type: string
                      example: NONE
                    preventedMatchId:
                      type: integer
                      format: int64
                      example: 0
                      description: 仅在因 STP 导致订单失效时出现。
                    preventedQuantity:
                      type: string
                      example: '1.200000'
                      description: 因 STP 导致订单失效的数量。
                    strategyId:
                      type: integer
                      format: int64
                      example: 1
                      description: 仅在下单时提供了 strategyId 参数时出现。
                    strategyType:
                      type: integer
                      format: int64
                      example: 1000000
                      description: 仅在下单时提供了 strategyType 参数时出现。
                    trailingDelta:
                      type: integer
                      format: int64
                      example: 10
                      description: 订单激活前所需的价格变动。
                    trailingTime:
                      type: integer
                      format: int64
                      example: -1
                      description: 追踪单被激活和跟踪价格变化的时间。
                    usedSor:
                      type: boolean
                      example: true
                      description: 用于确定订单是否使用SOR的字段。
                    workingFloor:
                      type: string
                      example: SOR
                      description: 用以定义订单是通过 SOR 还是由订单簿成交的。
                    pegPriceType:
                      type: string
                      example: PRIMARY_PEG
                      description: 挂钩价格类型。仅用于挂钩订单。
                    pegOffsetType:
                      type: string
                      example: PRICE_LEVEL
                      description: 挂钩价格偏移类型。如若需要，仅用于挂钩订单。
                    pegOffsetValue:
                      type: integer
                      format: int64
                      example: 5
                      description: 挂钩价格偏移值。如若需要，仅用于挂钩订单。
                    peggedPrice:
                      type: string
                      example: '87523.83710000'
                      description: 订单对应的当前挂钩价格。一旦确定，仅用于挂钩订单。
                    expiryReason:
                      type: string
                      example: INSUFFICIENT_LIQUIDITY
                      description: 订单过期的原因。当订单过期时出现。
  /api/v3/account:
    get:
      summary: 账户信息
      description: 获取当前账户信息。
      tags:
        - account
      operationId: getAccount
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/rest-api/account#get-account
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/rest-api/AccountApi/getAccount.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/rest_api/account_api/get_account.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/rest_api/Account/get_account.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/rest/account/GetAccountExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/restapi/AccountAPI/GetAccount/GetAccount.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/spot/account/GetAccountExample.php
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
        - name: omitZeroBalances
          in: query
          required: false
          description: 如果`true`，将隐藏所有零余额。
          schema:
            type: boolean
            example: false
            default: false
        - name: recvWindow
          in: query
          required: false
          description: 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
          schema:
            type: number
            format: float
            example: 5000
            maximum: 60000
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: '**数据源:** 缓存 => 数据库'
      responses:
        '200':
          description: 账户信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  makerCommission:
                    type: integer
                    format: int64
                    example: 15
                  takerCommission:
                    type: integer
                    format: int64
                    example: 15
                  buyerCommission:
                    type: integer
                    format: int64
                    example: 0
                  sellerCommission:
                    type: integer
                    format: int64
                    example: 0
                  commissionRates:
                    type: object
                    properties:
                      maker:
                        type: string
                        example: '0.00150000'
                      taker:
                        type: string
                        example: '0.00150000'
                      buyer:
                        type: string
                        example: '0.00000000'
                      seller:
                        type: string
                        example: '0.00000000'
                  canTrade:
                    type: boolean
                    example: true
                  canWithdraw:
                    type: boolean
                    example: true
                  canDeposit:
                    type: boolean
                    example: true
                  brokered:
                    type: boolean
                    example: false
                  requireSelfTradePrevention:
                    type: boolean
                    example: false
                  preventSor:
                    type: boolean
                    example: false
                  updateTime:
                    type: integer
                    format: int64
                    example: 123456789
                  accountType:
                    type: string
                    example: SPOT
                  balances:
                    type: array
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          example: BTC
                        free:
                          type: string
                          example: '4723846.89208129'
                        locked:
                          type: string
                          example: '0.00000000'
                  permissions:
                    type: array
                    items:
                      type: string
                      example: SPOT
                  uid:
                    type: integer
                    format: int64
                    example: 354937868
  /api/v3/openOrders:
    get:
      summary: 查看账户当前挂单
      description: 请小心使用不带symbol参数的调用
      tags:
        - account
      operationId: getOpenOrders
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/rest-api/account#get-open-orders
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/rest-api/AccountApi/getOpenOrders.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/rest_api/account_api/get_open_orders.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/rest_api/Account/get_open_orders.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/rest/account/GetOpenOrdersExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/restapi/AccountAPI/GetOpenOrders/GetOpenOrders.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/spot/account/GetOpenOrdersExample.php
      x-security-type: USER_DATA
      x-signed: true
      x-weight: 6 for a single symbol; 80 when the symbol parameter is omitted
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            example: LTCBTC
        - name: recvWindow
          in: query
          required: false
          description: 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
          schema:
            type: number
            format: float
            example: 5000
            maximum: 60000
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      x-parameters-notes: |-
        **数据源:** 缓存 => 数据库

        - 不带symbol参数，会返回所有交易对的挂单
      responses:
        '200':
          description: 查看账户当前挂单
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                      example: LTCBTC
                    orderId:
                      type: integer
                      format: int64
