# =================================================================
# Trading Engine 生产环境配置
# 交易执行引擎
# =================================================================

# =================================================================
# 数据库配置
# =================================================================
[database]
# 从环境变量 DATABASE_URL 加载
url = ""
max_connections = 10
min_connections = 5
max_lifetime = 1800

# =================================================================
# 缓存配置
# =================================================================
[cache]
# 从环境变量 REDIS_URL 加载
url = ""
ttl_seconds = 300
max_ticks_per_symbol = 1000

# =================================================================
# 交易所配置
# =================================================================
[exchange]
# 交易所 ID: binance / okx
id = "binance"

# 是否使用测试网
# true: 使用测试网（推荐开发测试）
# false: 使用主网（生产环境）
testnet = false

# =================================================================
# 交易配置
# =================================================================
[trading]
# 交易模式: "testnet" / "live"
mode = "live"

# 默认策略（可以被信号覆盖）
strategy = "rsi"

# 监控的交易对列表
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]

# 数据源轮询间隔（毫秒）
# 建议：100-500ms
poll_interval_ms = 100

# 数据源类型: "trades" / "tickers" / "candle1m"
# - trades: 逐笔成交（高频，资源消耗大）
# - tickers: 行情快照（中频）
# - candle1m: K线推送（低频，资源消耗最小，推荐）
data_source = "candle1m"

# =================================================================
# 风险控制配置
# =================================================================
[risk_control]

# ---------- 基础风控 ----------

# 单笔最大仓位（USDT）
max_position_size = 2000.0

# 单笔最大订单数量（BTC）
max_order_size = 0.01

# 止损百分比（小数）
# 0.02 = 2% 止损
stop_loss_pct = 0.02

# 止盈百分比（小数）
# 0.04 = 4% 止盈
take_profit_pct = 0.04

# ---------- 中级风控 ----------

# 日最大亏损（USDT）
# 当日亏损达到此值，停止交易
max_daily_loss = 500.0

# 最大回撤百分比（小数）
# 0.15 = 15% 最大回撤
max_drawdown_pct = 0.15

# 最大曝光度百分比（小数）
# 0.8 = 80% 最大资金暴露
max_exposure_pct = 0.8

# ---------- 高级风控 ----------

# Kelly 公式分数
# 0.25 = 1/4 Kelly（保守策略）
kelly_fraction = 0.25

# 波动率回看周期（tick数量）
volatility_lookback = 20

# 目标波动率（小数）
# 0.15 = 15% 年化波动率
volatility_target = 0.15

# 黑天鹅保护阈值（小数）
# 0.05 = 5% 瞬间波动触发保护
black_swan_threshold = 0.05

# 熔断冷却时间（秒）
# 3600 = 1小时冷却
circuit_breaker_cooldown = 3600
