  /api/v3/orderList/oco:
    post:
      summary: New 订单 列表 - OCO
      description: |-
        发送新 one-cancels-the-other (OCO) 订单，激活其中一个订单会立即取消另一个订单。

        - OCO 包含了两个订单，分别被称为 **上方订单** 和 **下方订单**。
        - 其中一个订单必须是 `LIMIT_MAKER/TAKE_PROFIT/TAKE_PROFIT_LIMIT` 订单，另一个订单必须是 `STOP_LOSS` 或 `STOP_LOSS_LIMIT` 订单。
        - 针对价格限制：
          - 如果 OCO 订单方向是 `SELL`：
            - `LIMIT_MAKER/TAKE_PROFIT_LIMIT` `price` > 最后交易价格 >  `STOP_LOSS/STOP_LOSS_LIMIT` `stopPrice`
            - `TAKE_PROFIT` `stopPrice` > 最后交易价格 > `STOP_LOSS/STOP_LOSS_LIMIT` `stopPrice`
          - 如果 OCO 订单方向是 `BUY`：
            - `LIMIT_MAKER/TAKE_PROFIT_LIMIT` `price` < 最后交易价格 < `stopPrice`
            - `TAKE_PROFIT` `stopPrice` < 最后交易价格 < `STOP_LOSS/STOP_LOSS_LIMIT` `stopPrice`
        - OCO 会添加 **2个订单** 到 `EXCHANGE_MAX_ORDERS` 过滤器和 `MAX_NUM_ORDERS` 过滤器中。
      tags:
        - trade
      operationId: orderListOco
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/rest-api/trade#order-list-oco
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/rest-api/TradeApi/orderListOco.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/rest_api/trade_api/order_list_oco.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/rest_api/Trade/order_list_oco.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/rest/trade/OrderListOcoExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/restapi/TradeAPI/OrderListOco/OrderListOco.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/spot/trade/OrderListOcoExample.php
      x-ip-weight: 1
      x-order-weight: 2
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
      x-parameters-notes: '**数据源:** 撮合引擎'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - symbol
                - side
                - quantity
                - aboveType
                - belowType
                - timestamp
              properties:
                symbol:
                  type: string
                  example: BNBUSDT
                listClientOrderId:
                  type: string
                  example: lH1YDkuQKWiXVXHPSKYEIp
                  description: 整个 OCO order list 的唯一ID。 如果未发送则自动生成。 仅当前一个订单已填满或完全过期时，才会接受具有相同的`listClientOrderId`。 `listClientOrderId` 与 `aboveClientOrderId` 和 `belowClientOrderId` 不同。
                side:
                  type: string
                  enum:
                    - BUY
                    - SELL
                  example: BUY
                quantity:
                  type: number
                  format: float
                  example: 1
                  description: 两个订单的数量。
                aboveType:
                  type: string
                  enum:
                    - STOP_LOSS_LIMIT
                    - STOP_LOSS
                    - LIMIT_MAKER
                    - TAKE_PROFIT
                    - TAKE_PROFIT_LIMIT
                  example: STOP_LOSS_LIMIT
                aboveClientOrderId:
                  type: string
                  example: aboveOrder1
                  description: 上方订单的唯一ID。 如果未发送则自动生成。
                aboveIcebergQty:
                  type: integer
                  format: int64
                  example: 1
                  description: 请注意，只有当 `aboveTimeInForce` 为 `GTC` 时才能使用。
                abovePrice:
                  type: number
                  format: float
                  example: 1
                  description: 当 `aboveType` 是 `STOP_LOSS_LIMIT`, `LIMIT_MAKER` 或 `TAKE_PROFIT_LIMIT` 时，可用以指定限价。
                aboveStopPrice:
