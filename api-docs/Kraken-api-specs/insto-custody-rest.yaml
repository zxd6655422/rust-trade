a":{"type":"integer","format":"int32","example":100},"style":"form"},{"in":"query","name":"offset","description":"Number of tasks to skip before the page begins, used together with `limit` for offset-based pagination. Defaults to 0 when omitted.","schema":{"type":"integer","format":"int32","example":0},"style":"form"},{"in":"query","name":"state","description":"Restrict the result set to tasks in one or more lifecycle states. Allowed values: `pending`, `approved`, `rejected`, `denied` (alias of `rejected`), `canceled`, `expired`, `failed`, `executed`.","schema":{"type":"array","items":{"type":"string","example":"pending"}},"style":"form"},{"in":"query","name":"current_user_decision","description":"Restrict the result set to tasks for which the caller has made the specified decision. One of `undecided`, `approved`, `denied`.","schema":{"type":"string","example":"undecided"},"style":"form"},{"in":"query","name":"task_id","description":"Restrict the result set to the supplied task IDs. Each value is a `T`-prefixed 14-char base32 identifier.","schema":{"type":"array","items":{"type":"string","example":"TABCDEF234567A"}},"style":"form"},{"in":"query","name":"approval_id","description":"Restrict the result set to tasks linked to the supplied approval UUIDs.","schema":{"type":"array","items":{"type":"string","example":"a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"}},"style":"form"},{"in":"query","name":"vault_id","description":"Restrict the result set to tasks scoped to the supplied vault IDs. Each value is a `V`-prefixed 14-char base32 identifier with a final check character.","schema":{"type":"array","items":{"type":"string","example":"VABCDEF234567A"}},"style":"form"},{"in":"query","name":"action","description":"Restrict the result set to tasks that contain one of the supplied action types. Accepts only the singular action names listed below (for example `request_withdrawal`, `create_vault`, `update_subquorum`). Multiple values are OR-ed.","schema":{"type":"array","items":{"type":"string","example":"request_withdrawal","enum":["update_subquorum","update_vault_user","update_vault_policy","request_withdrawal","remove_org_user","create_user","request_staking_allocation","update_withdrawal_address","update_user_permission","create_vault","update_vault","update_domain_policy","update_user_status","request_transfer_to_spot","create_api_user","update_api_user","request_staking_deallocation","request_custody_transfer_to_spot","request_pledge","request_pledge_release"]}},"style":"form"},{"in":"query","name":"created_at_from","description":"Include only tasks created at or after this RFC 3339 UTC timestamp (inclusive), e.g. 2026-01-15T12:34:56Z; the Z (UTC) offset is required.","schema":{"$ref":"#/components/schemas/google.protobuf.Timestamp"},"example":"2026-01-15T12:34:56Z","style":"form"},{"in":"query","name":"created_at_to","description":"Include only tasks created at or before this RFC 3339 UTC timestamp (inclusive), e.g. 2026-01-15T12:34:56Z; the Z (UTC) offset is required.","schema":{"$ref":"#/components/schemas/google.protobuf.Timestamp"},"example":"2026-01-15T12:34:56Z","style":"form"},{"in":"query","name":"updated_at_from","description":"Include only tasks last updated at or after this RFC 3339 UTC timestamp (inclusive), e.g. 2026-01-15T12:34:56Z; the Z (UTC) offset is required.","schema":{"$ref":"#/components/schemas/google.protobuf.Timestamp"},"example":"2026-01-15T12:34:56Z","style":"form"},{"in":"query","name":"updated_at_to","description":"Include only tasks last updated at or before this RFC 3339 UTC timestamp (inclusive), e.g. 2026-01-15T12:34:56Z; the Z (UTC) offset is required.","schema":{"$ref":"#/components/schemas/google.protobuf.Timestamp"},"example":"2026-01-15T12:34:56Z","style":"form"},{"in":"query","name":"expires_at_from","description":"Include only tasks expiring at or after this RFC 3339 UTC timestamp (inclusive), e.g. 2026-01-15T12:34:56Z; the Z (UTC) offset is required.","schema":{"$ref":"#/components/schemas/google.protobuf.Timestamp"},"example":"2026-01-15T12:34:56Z","style":"form"},{"in":"query","name":"expires_at_to","description":"Include only tasks expiring at or before this RFC 3339 UTC timestamp (inclusive), e.g. 2026-01-15T12:34:56Z; the Z (UTC) offset is required.","schema":{"$ref":"#/components/schemas/google.protobuf.Timestamp"},"example":"2026-01-15T12:34:56Z","style":"form"},{"in":"query","name":"sort","description":"Ordering as a single `field:direction` token (direction optional, defaults to `desc`). Only one column is supported. Allowed fields: `id`, `state`, `vault_id`, `created_at`, `updated_at`, `expires_at`. Defaults to `created_at:desc`.","schema":{"type":"string","example":"created_at:desc"},"style":"form"}],"responses":{"200":{"description":"Page of task summaries matching the requested filters.","content":{"application/json":{"schema":{"type":"object","properties":{"result":{"description":"Page of task summaries matching the requested filters, ordered by the requested column.","type":"array","items":{"type":"object","properties":{"task_id":{"description":"Task identifier, a `T`-prefixed 14-char base32 string.","type":"string","example":"TABCDEF234567A"},"approval_id":{"description":"Approval UUID, when the task is part of an approval flow.","type":"string","example":"a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"},"type":{"description":"Coarse task-level discriminator. Every task is exposed in the instruction-normalized model, so this is always `normalized_task`. Use `instruction_types` for the specific actions the task performs.","type":"string","example":"normalized_task"},"state":{"description":"Lifecycle state of the task. One of `pending`, `approved`, `rejected`, `canceled`, `expired`, `failed`, `executed`.","type":"string","example":"pending"},"created_at":{"description":"RFC 3339 UTC timestamp when the task was created.","type":"string","format":"date-time","example":"2026-01-15T12:34:56Z"},"updated_at":{"description":"RFC 3339 UTC timestamp when the task