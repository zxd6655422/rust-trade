      summary: 撤消挂单再下单
      description: |-
        - 撤消挂单并在同个交易对上重新下单。
        - 在撤消订单和下单前会判断: 1) 过滤器参数, 以及 2) 目前下单数量。
        - 即使请求中没有尝试发送新订单，比如(`newOrderResult: NOT_ATTEMPTED`)，未成交订单的数量仍然会加1。
        - 通过此接口只能撤消订单列表中的单个订单，但结果与撤消整个订单列表相同。
