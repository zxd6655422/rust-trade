        '200':
          description: 合约 账户 Balance V2
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    accountAlias:
                      type: string
                      example: SgsR
                      description: 唯一账户别名。
                    asset:
                      type: string
                      example: USDT
                      description: 资产名称。
                    balance:
                      type: string
                      example: '122607.35137903'
                      description: 钱包余额。
                    crossWalletBalance:
                      type: string
                      example: '23.72469206'
                      description: 全仓钱包余额。
                    crossUnPnl:
                      type: string
                      example: '0.00000000'
                      description: 全仓持仓未实现盈亏。
                    availableBalance:
                      type: string
                      example: '23.72469206'
                      description: 可用余额。
                    maxWithdrawAmount:
                      type: string
                      example: '23.72469206'
                      description: 最大可转出余额。
                    marginAvailable:
                      type: boolean
                      example: true
                      description: 在多资产模式下，该资产是否可作为保证金。
                    updateTime:
                      type: integer
                      example: 1617939110373
                      format: int64
                      description: 最后更新时间（毫秒）。
