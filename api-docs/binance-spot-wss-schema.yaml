        备注：

        * 当同时提供 `cancelOrderId` 和 `cancelOrigClientOrderId` 两个参数时，系统首先将会使用 `cancelOrderId` 来搜索订单。然后， 查找结果中的 `cancelOrigClientOrderId` 的值将会被用来验证订单。如果两个条件都不满足，则请求将被拒绝。

        * `cancelNewClientOrderId` 将替换已撤销订单的 `clientOrderId`，为新订单腾出空间。

        * `newClientOrderId` 指定下单的 `clientOrderId` 值。

          仅当前一个订单已成交或过期时，才会接受具有相同 `clientOrderId` 的新订单。

          新订单可以重用已取消订单的旧 `clientOrderId`。

        * 此 cancel-replace 操作**不是事务性的**。

          如果一个操作成功但另一个操作失败，则仍然执行成功的操作。

          例如，在 `STOP_ON_FAILURE` 模式下，如果下新订单达失败，旧订单仍然被撤销。

        * 过滤器和订单次数限制会在撤销和下订单之前评估。

        * 如果未尝试下新订单，订单次数仍会增加。

        * 与 [`order.cancel`](#order-cancel) 一样，如果您撤销订单列表内的某个订单，则整个订单列表将被撤销。

        * 当仅发送 `orderId` 时,取消订单的执行(单个 Cancel 或作为 Cancel-Replace 的一部分)总是更快。发送 `origClientOrderId` 或同时发送 `orderId` + `origClientOrderId` 会稍慢。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: 客户端生成的请求标识符。
                  example: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - order.cancelReplace
                  example: order.cancelReplace
                params:
                  type: object
                  properties:
                    symbol:
                      type: string
                      example: BNBUSDT
                    cancelReplaceMode:
                      type: string
                      enum:
                        - STOP_ON_FAILURE
                        - ALLOW_FAILURE
                      example: STOP_ON_FAILURE
                      description: 指定类型：`STOP_ON_FAILURE` - 如果撤消订单失败将不会继续重新下单。<br/> `ALLOW_FAILURE` - 不管撤消订单是否成功都会继续重新下单。
                    cancelOrderId:
                      type: integer
                      format: int64
                      example: 1
                      description: 必须提供 `cancelOrderId` 或者 `cancelOrigClientOrderId`。 <br></br> 当同时提供 `cancelOrderId` 和 `cancelOrigClientOrderId` 两个参数时，系统首先将会使用 `cancelOrderId` 来搜索订单。<br></br> 然后， 查找结果中的 `cancelOrigClientOrderId` 的值将会被用来验证订单。<br></br> 如果两个条件都不满足，则请求将被拒绝。
                    cancelOrigClientOrderId:
                      type: string
                      example: myOrder1
                      description: 必须提供 `cancelOrderId` 或者 `cancelOrigClientOrderId`。 <br></br> 当同时提供 `cancelOrderId` 和 `cancelOrigClientOrderId` 两个参数时，系统首先将会使用 `cancelOrderId` 来搜索订单。<br></br> 然后， 查找结果中的 `cancelOrigClientOrderId` 的值将会被用来验证订单。<br></br> 如果两个条件都不满足，则请求将被拒绝。
                    cancelNewClientOrderId:
                      type: string
                      example: cancelMyOrder1
                      description: 用户自定义的id，如空缺系统会自动赋值
                    side:
                      type: string
                      enum:
                        - BUY
                        - SELL
                      example: BUY
                      description: 详见枚举定义：[订单方向](/products/spot/enums#side)
                    type:
                      type: string
                      enum:
                        - MARKET
                        - LIMIT
                        - STOP_LOSS
                        - STOP_LOSS_LIMIT
                        - TAKE_PROFIT
                        - TAKE_PROFIT_LIMIT
                        - LIMIT_MAKER
                      example: MARKET
                      description: 详见枚举定义：[订单类型](/products/spot/enums#ordertypes)
                    timeInForce:
                      type: string
                      enum:
                        - GTC
                        - IOC
                        - FOK
                      example: GTC
                      description: 详见枚举定义：[生效时间](/products/spot/enums#timeinforce)
                    price:
                      type: number
                      format: float
                      example: 1
                    quantity:
                      type: number
                      format: float
                      example: 1
                    quoteOrderQty:
                      type: number
                      format: float
                      example: 1
                    newClientOrderId:
                      type: string
                      example: myOrder2
                      description: 用于辨识新订单。
                    newOrderRespType:
                      type: string
                      enum:
                        - ACK
                        - RESULT
                        - FULL
                      example: ACK
                      description: '指定响应类型: <br/> 指定响应类型 `ACK`, `RESULT`, or `FULL`; `MARKET` 与 `LIMIT` 订单默认为`FULL`， 其他默认为`ACK`。'
                    stopPrice:
                      type: number
                      format: float
                      example: 1
                      description: 仅 `STOP_LOSS`, `STOP_LOSS_LIMIT`, `TAKE_PROFIT`, `TAKE_PROFIT_LIMIT` 需要此参数。
                    trailingDelta:
                      type: number
                      format: float
                      example: 1
                      description: 参考 [追踪止盈止损(Trailing Stop)订单常见问题](/products/spot/faqs/trailing-stop-faq)
                    icebergQty:
                      type: number
                      format: float
                      example: 1
                      description: 仅有限价单(包括条件限价单与限价做事单)可以使用该参数，含义为创建冰山订单并指定冰山订单的数量。
                    strategyId:
                      type: integer
                      format: int64
                      example: 1
                    strategyType:
                      type: integer
                      example: 1
                      description: 不能低于 `1000000`。
                    selfTradePreventionMode:
                      type: string
                      enum:
                        - NONE
                        - EXPIRE_TAKER
                        - EXPIRE_MAKER
                        - EXPIRE_BOTH
                        - DECREMENT
                        - TRANSFER
                      example: NONE
                      description: 允许的 ENUM 取决于交易对的配置。支持的值有：[STP 模式](/products/spot/enums#stpmodes)。
                    cancelRestrictions:
                      type: string
                      enum:
                        - ONLY_NEW
                        - ONLY_PARTIALLY_FILLED
                      example: ONLY_NEW
                      description: '支持的值: <br>`ONLY_NEW` - 如果订单状态为 `NEW`，撤销将成功。<br> `ONLY_PARTIALLY_FILLED` - 如果订单状态为 `PARTIALLY_FILLED`，撤销将成功。'
                    orderRateLimitExceededMode:
                      type: string
                      enum:
                        - DO_NOTHING
                        - CANCEL_ONLY
                      example: DO_NOTHING
                      description: 支持的值： <br></br> `DO_NOTHING`（默认值）- 仅在账户未超过未成交订单频率限制时，会尝试取消订单。<br></br> `CANCEL_ONLY` - 将始终取消订单。
                    pegPriceType:
                      type: string
                      enum:
                        - PRIMARY_PEG
                        - MARKET_PEG
                      example: PRIMARY_PEG
                      description: '`PRIMARY_PEG` 或 `MARKET_PEG`。 <br> 参阅 关于挂钩订单参数的注意事项'
                    pegOffsetValue:
                      type: integer
                      example: 1
                      maximum: 100
                      description: 用于挂钩的价格水平（最大值：100）。 <br> 参阅 关于挂钩订单参数的注意事项
                    pegOffsetType:
                      type: string
                      enum:
                        - PRICE_LEVEL
                      example: PRICE_LEVEL
                      description: 仅支持 `PRICE_LEVEL`。 <br> 参阅 关于挂钩订单参数的注意事项
                    recvWindow:
                      type: number
                      format: float
                      example: 5000
                      maximum: 60000
                      description: 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
                    timestamp:
                      type: integer
                      example: 1770736694138
                      format: int64
                      description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
                    apiKey:
                      type: string
                      description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
                      example: API_KEY
                  additionalProperties: false
                  required:
                    - symbol
                    - cancelReplaceMode
                    - side
                    - type
                    - timestamp
                    - apiKey
              required:
                - id
                - method
                - params
              additionalProperties: false
            example:
              id: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
              method: order.cancelReplace
              params:
                symbol: BNBUSDT
                cancelReplaceMode: STOP_ON_FAILURE
                cancelOrderId: 1
                cancelOrigClientOrderId: myOrder1
                cancelNewClientOrderId: cancelMyOrder1
                side: BUY
                type: MARKET
                timeInForce: GTC
                price: 1
                quantity: 1
                quoteOrderQty: 1
                newClientOrderId: myOrder2
                newOrderRespType: ACK
                stopPrice: 1
                trailingDelta: 1
                icebergQty: 1
                strategyId: 1
                strategyType: 1
                selfTradePreventionMode: NONE
                cancelRestrictions: ONLY_NEW
                orderRateLimitExceededMode: DO_NOTHING
                pegPriceType: PRIMARY_PEG
                pegOffsetValue: 1
                pegOffsetType: PRICE_LEVEL
                recvWindow: 5000
                timestamp: 1770736694138
                apiKey: API_KEY
