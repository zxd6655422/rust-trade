                      type: integer
                      example: 1
                      default: 500
                      maximum: 1000
                      description: '默认值: 500; 最大值: 1000'
                    orderId:
                      type: integer
                      format: int64
                      example: 1
                      description: 订单 ID
                    recvWindow:
                      type: number
                      format: float
                      example: 5000
                      maximum: 60000
                      description: 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
                    timestamp:
                      type: integer
