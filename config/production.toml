# 生产环境配置

# 日志等级: trace, debug, info, warn, error
log_level = "info"

symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "SUIUSDT", "BNBUSDT", "HYPEUSDT", "SPCXUSDT", "TSLAUSDT", "NVDAUSDT", "AAOIUSDT", "MUUSDT", "SKHYNIXUSDT"]

# 只有合约的交易对（使用 /fapi/v1/klines）
futures_symbols = ["SPCXUSDT", "TSLAUSDT", "NVDAUSDT", "AAOIUSDT", "MUUSDT", "SKHYNIXUSDT"]

[server]
host = "0.0.0.0"
port = 8080

[database]
max_connections = 10
min_connections = 2
max_lifetime = 1800

[cache]
[cache.memory]
max_ticks_per_symbol = 2000
ttl_seconds = 600

[cache.redis]
pool_size = 20
ttl_seconds = 7200
max_ticks_per_symbol = 20000

[paper_trading]
enabled = false
strategy = "rsi"
initial_capital = 50000.0

# Data collector configuration
[collector]
# Mode: "disabled" / "tick" / "candle1m"
# - disabled: No data collection (backtest only)
# - tick: Collect tick data (high frequency, ~5000 records/minute/symbol)
# - candle1m: Collect 1m candle data (low frequency, 1 record/minute/symbol, RECOMMENDED)
mode = "candle1m"

# Enable tick data collection in parallel (for high-frequency analysis)
# This will use more resources but provides more detailed data
enable_tick = false

# Poll interval in seconds (only for candle1m mode)
poll_interval_secs = 10

# Historical data backfill (runs once on startup)
backfill_enabled = true
backfill_start_date = "2020-01-01"

# Rate limiting configuration
# Binance: 20 req/s (1200/min), OKX: 12 req/s (60/5s)
# 建议保持在限制的 50% 以下，留足安全边际
[collector.rate_limit]
# Backfill 每个请求间隔 (ms)
# 300ms ≈ 3.3 req/s per symbol
backfill_interval_ms = 300

# 最大并发 backfill 数量
# 3 并发 × 3.3 req/s ≈ 10 req/s (安全)
max_concurrent_backfills = 3

# 轮询批次大小
poll_batch_size = 5

# 轮询批次间延迟 (ms)
poll_batch_delay_ms = 500
