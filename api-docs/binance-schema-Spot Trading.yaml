                  description: '`PRIMARY_PEG` 或 `MARKET_PEG`。 参阅 [关于挂钩订单参数的注意事项](/products/spot/faqs/pegged_orders)'
                abovePegOffsetType:
                  type: string
                  enum:
                    - PRICE_LEVEL
                  example: PRICE_LEVEL
                abovePegOffsetValue:
                  type: integer
                  example: 1
                belowType:
                  type: string
                  enum:
                    - STOP_LOSS
                    - STOP_LOSS_LIMIT
                    - TAKE_PROFIT
                    - TAKE_PROFIT_LIMIT
                  example: STOP_LOSS
                  description: 支持值：`STOP_LOSS`, `STOP_LOSS_LIMIT`, `TAKE_PROFIT`, `TAKE_PROFIT_LIMIT`。
                belowClientOrderId:
                  type: string
                  example: belowOrder1
                  description: 下方订单的唯一ID。 如果未发送则自动生成。
                belowIcebergQty:
                  type: integer
                  format: int64
                  example: 1
                  description: 请注意，只有当 `belowTimeInForce` 为 `GTC` 时才能使用。
                belowPrice:
                  type: number
                  format: float
                  example: 1
                  description: 当 `belowType` 是 `STOP_LOSS_LIMIT`, `LIMIT_MAKER` 或 `TAKE_PROFIT_LIMIT` 时，可用以指定限价。
