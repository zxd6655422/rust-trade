,"tags":["Webhooks"],"description":"Register a new webhook endpoint to receive event notifications from Payward Embed.\n\nWhen you register a webhook, you'll receive a `secret` in the response. This secret\nis **base64-encoded** and is used to verify webhook signatures. Store it securely —\nit is only returned once and cannot be retrieved again.\n\nBefore registering a webhook, make sure your callback domain has been allowlisted.\n\nYou can optionally specify `enabled` and `events` at registration time, or configure\nthem later using the **Update Webhook** endpoint.\n\n## URL Requirements\n\n- Must use HTTPS protocol\n- Maximum length: 2048 characters\n- Must be a valid URL format\n- Must have a valid host (not empty)\n- Host cannot be a protocol name (e.g., `http`, `https`, `ftp`, `file`, `mailto`, `ssh`, `git`, `svn`)\n- Path cannot start with `//` (indicates malformed URL)\n- Cannot contain credentials (e.g., `https://user:pass@example.com` is rejected)\n\n### Valid URL Examples\n\n- `https://example.com/webhook`\n- `https://example.com:8443/webhook`\n\n### Invalid URL Examples\n\n- `http://example.com/webhook` (HTTP not allowed)\n- `https://https//example.com` (malformed - host is \"https\")\n- `https://user:pass@example.com/webhook` (credentials not allowed)\n- `invalid-url` (not a valid URL)\n","parameters":[{"$ref":"#/components/parameters/PaywardVersion"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"url":{"type":"string","format":"uri","maxLength":2048,"description":"The HTTPS URL where webhook events will be sent. This endpoint must be\npublicly accessible and respond to POST requests.\n","example":"https://your-domain.com/webhooks/payward"},"enabled":{"type":"boolean","default":false,"description":"Whether the webhook is enabled. Defaults to `false`. Disabled webhooks\nwill not receive any events until enabled.\n","example":true},"events":{"type":"array","default":[],"description":"List of event types to subscribe to. Defaults to `[]` (no events).\nUse this to configure which events trigger webhook notifications.\n","items":{"type":"string","pattern":"^[a-zA-Z0-9._]+$","maxLength":100},"minItems":0,"maxItems":50,"example":["quote.executed"]}},"required":["url"]}}}},"responses":{"200":{"description":"Webhook registered successfully","content":{"application/json":{"schema":{"type":"object","properties":{"result":{"type":"object","properties":{"webhook":{"type":"object","description":"The created webhook configuration","properties":{"id":{"type":"string","description":"Unique identifier for the webhook","example":"WHTEST-XXXXX-EXAMPLE"},"url":{"type":"string","format":"uri","description":"The registered webhook URL","example":"https://your-domain.com/webhooks/payward"},"enabled":{"type":"boolean","description":"Whether the webhook is enabled. Defaults to `false`.","example":false},"subscribed_events":{"type":"array","description":"List of event types this webhook is subscribed to","items":{"type":"string"},"example":[]},"available_events":{"type":"array","description":"All available event types that can be subscribed to","items":{"type":"string"},"example":["custom_order.executed","custom_order.execution_failed","custom_order.cancelled","quote.executed","quote.execution_failed","quote.cancelled","reward.paid","user.verified","user.closed","user.disabled","deposit.status_updated","withdrawal.status_updated"]},"created_at":{"type":"string","format":"date-time","description":"When the webhook was created","example":"2023-01-01T00:00:00Z"},"updated_at":{"type":"string","format":"date-time","description":"When the webhook was last updated","example":"2023-01-01T00:00:00Z"}},"required":["id","url","enabled","subscribed_events","available_events","created_at","updated_at"]},"secret":{"type":"string","description":"Base64-encoded HMAC secret for webhook signature verification.\n\n**Important:** This secret is only returned once. Store it securely\nas it cannot be retrieved again. You'll need this secret to verify\nwebhook signatures on incoming events.\n","example":"dGVzdC1zZWNyZXQtcGxlYXNlLWlnbm9yZQ=="}},"required":["webhook","secret"]}}}}}},"400":{"$ref":"#/components/responses/BadRequestError"},"401":{"$ref":"#/components/responses/UnauthorizedError"},"403":{"$ref":"#/components/responses/ForbiddenError"},"404":{"$ref":"#/components/responses/NotFoundError"},"408":{"$ref":"#/components/responses/RequestTimeoutError"},"409":{"description":"Conflict. Error codes:\n- `ENexus:Webhook already exists` — not retryable\n","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"},"example":{"errors":[{"status":"409","code":"ENexus:Webhook already exists","detail":null}],"result":null}}}},"429":{"$ref":"#/components/responses/RateLimitError"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailableError"}}}},"/b2b/webhooks/{webhook_id}":{"patch":{"operationId":"updateEmbedWebhook","summary":"Update Webhook","tags":["Webhooks"],"description":"Update a webhook's enabled status and/or event subscriptions.\n\nUse this endpoint to:\n- Enable or disable a webhook without deleting it\n- Update which events the webhook is subscribed to\n\nDisabled webhooks will not receive any events until re-enabled.\n\n**Note:** The webhook URL cannot be updated. To change the URL, delete the webhook\nand register a new one.\n","parameters":[{"$ref":"#/components/parameters/PaywardVersion"},{"$ref":"#/components/parameters/WebhookIdPath"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"enabled":{"type":"boolean","description":"Whether the webhook should be enabled or disabled","example":true},"events":{"type":"array","description":"List of event types to subscribe to. This **replaces** all existing\nevent subscriptions. Pass an empty array `[]` to unsubscribe from all events.\n","items":{"type":"string","pattern":"^[a-zA-Z0-