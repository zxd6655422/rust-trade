                            description: 交易对
                          i:
                            type: string
                            example: 1m
                            description: K线间隔
                          f:
                            type: integer
                            format: int64
                            example: 100
                            description: 该K线期间第一笔成交ID
                          L:
                            type: integer
                            format: int64
                            example: 200
                            description: 该K线期间末一笔成交ID
                          o:
                            type: string
                            example: 0.001
                            description: 该K线期间第一笔成交价
                          c:
                            type: string
                            example: 0.002
                            description: 该K线期间末一笔成交价
                          h:
                            type: string
                            example: 0.0025
                            description: 该K线期间最高成交价
                          l:
                            type: string
                            example: 0.0015
