        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/restapi/TradeAPI/NewAlgoOrder/NewAlgoOrder.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-usds-futures/trade/NewAlgoOrderExample.php
      x-security-type: TRADE
      x-signed: true
      x-weight: |-
        1 on 10s order rate limit(X-MBX-ORDER-COUNT-10S);
        1 on 1min order rate limit(X-MBX-ORDER-COUNT-1M);
        0 on IP rate limit(x-mbx-used-weight-1m)
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
      x-parameters-notes: |-
        - 类型为 `STOP` 的条件订单可以传入参数 `timeInForce`（默认值为 `GTC`）。
        - 类型为 `TAKE_PROFIT` 的条件订单可以传入参数 `timeInForce`（默认值为 `GTC`）。
        - 条件单的触发必须:
          - 如果订单参数`priceProtect`为true:
            - 达到触发价时，`MARK_PRICE`(标记价格)与`CONTRACT_PRICE`(合约最新价)之间的价差不能超过改symbol触发保护阈值
            - 触发保护阈值请参考接口`GET /fapi/v1/exchangeInfo` 返回内容相应symbol中"triggerProtect"字段
          - `STOP`, `STOP_MARKET` 止损单:
            - 买入: 最新合约价格/标记价格高于等于触发价`stopPrice`
            - 卖出: 最新合约价格/标记价格低于等于触发价`stopPrice`
          - `TAKE_PROFIT`, `TAKE_PROFIT_MARKET` 止盈单:
            - 买入: 最新合约价格/标记价格低于等于触发价`stopPrice`
            - 卖出: 最新合约价格/标记价格高于等于触发价`stopPrice`
          - `TRAILING_STOP_MARKET` 跟踪止损单:
            - 买入: 当合约价格/标记价格区间最低价格低于激活价格`activatePrice`,且最新合约价格/标记价高于等于最低价设定回调幅度。
            - 卖出: 当合约价格/标记价格区间最高价格高于激活价格`activatePrice`,且最新合约价格/标记价低于等于最高价设定回调幅度。
        - `TRAILING_STOP_MARKET` 跟踪止损单如果遇到报错 `{"code": -2021, "msg": "Order would immediately trigger."}` > 表示订单不满足以下条件:
          - 买入: 指定的`activatePrice` 必须小于 latest price
          - 卖出: 指定的`activatePrice` 必须大于 latest price
        - `STOP_MARKET`, `TAKE_PROFIT_MARKET` 配合 `closePosition`=`true`:
          - 条件单触发依照上述条件单触发逻辑
          - 条件触发后，平掉当时持有所有多头仓位(若为卖单)或当时持有所有空头仓位(若为买单)
          - 不支持 `quantity` 参数
          - 自带只平仓属性，不支持`reduceOnly`参数
          - 双开模式下,`LONG`方向上不支持`BUY`; `SHORT` 方向上不支持`SELL`
        - `selfTradePreventionMode` 仅在 `timeInForce`为`IOC`或`GTC`或`GTD`时生效.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - algoType
                - symbol
                - side
                - type
                - timestamp
              properties:
                algoType:
                  type: string
                  example: CONDITIONAL
                  enum:
                    - CONDITIONAL
                symbol:
                  type: string
                  example: BNBUSDT
                side:
                  type: string
                  example: BUY
                  enum:
                    - BUY
                    - SELL
                positionSide:
                  type: string
                  example: BOTH
                  description: 持仓方向，单向持仓模式下非必填，默认且仅可填`BOTH`;在双向持仓模式下必填,且仅可选择 `LONG` 或 `SHORT`
                type:
                  type: string
                  example: STOP_MARKET
                  enum:
                    - LIMIT
                    - MARKET
                    - STOP
                    - STOP_MARKET
                    - TAKE_PROFIT
                    - TAKE_PROFIT_MARKET
                    - TRAILING_STOP_MARKET
                timeInForce:
                  type: string
                  example: GTC
                  enum:
                    - GTC
                    - IOC
                    - FOK
                    - GTX
                    - GTD
                    - RPI
                quantity:
                  type: number
                  example: '1.0'
                  format: float
                  description: 下单数量,使用`closePosition`不支持此参数。
                price:
                  type: number
                  example: '1.0'
                  format: float
                triggerPrice:
                  type: number
                  example: '1.0'
                  format: float
                  description: 触发价
                workingType:
                  type: string
                  example: MARK_PRICE
                  default: CONTRACT_PRICE
                  enum:
                    - MARK_PRICE
                    - CONTRACT_PRICE
                priceMatch:
                  type: string
                  example: OPPONENT
                  enum:
                    - OPPONENT
                    - OPPONENT_5
                    - OPPONENT_10
                    - OPPONENT_20
                    - QUEUE
                    - QUEUE_5
                    - QUEUE_10
                    - QUEUE_20
                  description: 仅 `LIMIT`/`STOP`/`TAKE_PROFIT` 订单类型可用；不能与 `price` 参数同时使用
                closePosition:
                  type: string
                  example: 'true'
                  enum:
                    - 'true'
                    - 'false'
                  description: 触发后全部平仓，仅支持`STOP_MARKET`和`TAKE_PROFIT_MARKET`；不与`quantity`合用；自带只平仓效果，不与`reduceOnly` 合用"
                priceProtect:
                  type: string
                  example: 'true'
                  default: 'false'
                  enum:
                    - 'true'
                    - 'false'
                  description: 仅 `STOP_MARKET` 和 `TAKE_PROFIT_MARKET` 订单类型可用。当价格达到触发价时，标记价格与合约最新价之间的价差不能超过该symbol的触发保护阈值。
                reduceOnly:
                  type: string
                  example: 'true'
                  default: 'false'
                  enum:
                    - 'true'
                    - 'false'
                  description: 双开模式下不接受此参数； 使用`closePosition`不支持此参数。"
                activatePrice:
                  type: number
                  example: '1.0'
                  format: float
                  description: 追踪止损激活价格，仅`TRAILING_STOP_MARKET` 需要此参数, 默认为下单当前市场价格(支持不同`workingType`)
                callbackRate:
                  type: number
                  example: 1
                  format: float
                  minimum: 0.1
                  maximum: 10
                  description: 追踪止损回调比例，可取值范围[0.1, 10],其中 1代表1% ,仅`TRAILING_STOP_MARKET` 需要此参数
                clientAlgoId:
                  type: string
                  example: '1'
                  description: 用户自定义的条件订单号，不可以重复出现在挂单中。如空缺系统会自动赋值。必须满足正则规则 `^[\.A-Z\:/a-z0-9_-]{1,36}$`
                newOrderRespType:
                  type: string
                  example: ACK
                  default: ACK
                  enum:
                    - ACK
                    - RESULT
                selfTradePreventionMode:
                  type: string
                  example: EXPIRE_TAKER
                  default: NONE
                  enum:
                    - NONE
                    - EXPIRE_TAKER
                    - EXPIRE_BOTH
                    - EXPIRE_MAKER
                  description: 订单自成交保护模式，默认 `NONE`。
                goodTillDate:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: TIF为GTD时订单的自动取消时间， 当`timeInforce`为`GTD`时必传；传入的时间戳仅保留秒级精度，毫秒级部分会被自动忽略，时间戳需大于当前时间+600s且小于253402300799000
                recvWindow:
                  type: integer
                  example: 5000
                  format: int64
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: New Algo 订单
          content:
            application/json:
              schema:
                type: object
                properties:
                  algoId:
                    type: integer
                    example: 2146760
                    format: int64
                  clientAlgoId:
                    type: string
                    example: 6B2I9XVcJpCjqPAJ4YoFX7
                  algoType:
                    type: string
                    example: CONDITIONAL
                  orderType:
                    type: string
                    example: TAKE_PROFIT
                  symbol:
                    type: string
                    example: BNBUSDT
                  side:
                    type: string
                    example: SELL
                  positionSide:
                    type: string
                    example: BOTH
                  timeInForce:
                    type: string
                    example: GTC
                  quantity:
                    type: string
                    example: '0.01'
                  algoStatus:
                    type: string
                    example: NEW
                  triggerPrice:
                    type: string
                    example: '750.000'
                  price:
                    type: string
                    example: '750.000'
                  icebergQuantity:
                    type: string
                    example: 'null'
                  selfTradePreventionMode:
                    type: string
                    example: EXPIRE_MAKER
                  workingType:
                    type: string
                    example: CONTRACT_PRICE
                  priceMatch:
                    type: string
                    example: NONE
                  closePosition:
                    type: boolean
                    example: false
                  priceProtect:
                    type: boolean
                    example: false
                  reduceOnly:
                    type: boolean
                    example: false
                  activatePrice:
                    type: string
                    example: ''
                    description: TRAILING_STOP_MARKET order
                  callbackRate:
                    type: string
                    example: ''
                    description: TRAILING_STOP_MARKET order
                  createTime:
                    type: integer
                    example: 1750485492076
                    format: int64
                  updateTime:
                    type: integer
