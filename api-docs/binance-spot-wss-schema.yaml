      summary: 订阅用户数据流
      description: |-
        订阅当前 WebSocket 连接中的用户数据流。

        **注意：**
          - 此方法需要使用 Ed25519 密钥并经过鉴权的 WebSocket 连接。请参考 `session.logon`。
          - 如果需要查看订阅状态,可以通过 `session.status `查询，当`userDataStream` 字段值为 `true` 时,表示您有一个有效的订阅.
          - 用户数据流在 JSON 和 [SBE 会话](/products/spot/faqs/sbe_faq) 中均可用。
            - 有关事件格式详情，请参阅 [用户数据流](/products/spot/user-data-stream)。
            - 对于 SBE，仅支持 SBE 模式 2:1 或更高版本。
