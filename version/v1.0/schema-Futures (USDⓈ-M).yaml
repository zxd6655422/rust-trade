      description: |-
        持仓ADL队列估算

        * 每30秒更新数据
        * 队列分数0，1，2，3，4，分数越高说明在ADL队列中的位置越靠前
        * 对于单向持仓模式或者是逐仓状态下的双向持仓模式的交易对，会返回 "LONG", "SHORT" 和 "BOTH" 分别表示不同持仓方向上持仓的adl队列分数
          * 对于全仓状态下的双向持仓模式的交易对，会返回 "LONG", "SHORT" 和 "HEDGE",
