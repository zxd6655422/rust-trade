openapi: 3.0.2
info:
  title: Futures (USDⓈ-M) WebSocket API
  description: 访问市场数据、管理账户，并交易 USDⓈ-M 永续合约。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: ws-api
x-rate-limits-guide: products/derivatives-trading-usds-futures/general-info#访问限制
x-security-guide: products/derivatives-trading-usds-futures/general-info#接口鉴权类型
x-api-key-guide: https://www.binance.com/cn/support/faq/detail/360002502072
externalDocs:
  description: Futures (USDⓈ-M) docs
  url: https://developers.binance.com/en/docs/products/derivatives-trading-usds-futures/general-info
tags:
  - name: account
    x-displayName: 账户接口
  - name: market-data
    x-displayName: 行情接口
  - name: trade
    x-displayName: 交易接口
  - name: user-data-streams
    x-displayName: Websocket账户信息推送
servers:
  - url: wss://ws-fapi.binance.com/ws-fapi/v1
  - url: wss://testnet.binancefuture.com/ws-fapi/v1
paths:
  /account.status:
    post:
      summary: 账户信息 (USER_DATA)
      description: 现有账户信息。 用户在单资产模式和多资产模式下会看到不同结果，响应部分的注释解释了两种模式下的不同。
      tags:
        - account
      operationId: accountInformation
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/ws-api/account#account-information
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/websocket-api/AccountApi/accountInformation.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/websocket_api/account_api/account_information.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/websocket_api/Account/account_information.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/websocket/api/account/AccountInformationExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/websocketapi/AccountAPI/AccountInformation/AccountInformation.go
      x-ip-weight: 5
      x-security-type: USER_DATA
      x-signed: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 请求 ID。
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - account.status
                  example: account.status
                params:
                  type: object
                  properties:
                    recvWindow:
                      type: integer
                      example: 5000
                      format: int64
                      description: 接收窗口。
                    timestamp:
                      type: integer
                      example: 1770736694138
                      format: int64
                      description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
                    apiKey:
                      type: string
                      description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
                      example: API_KEY
                  additionalProperties: false
                  required:
                    - timestamp
                    - apiKey
              required:
                - id
                - method
                - params
              additionalProperties: false
            example:
              id: e9d6b4349871b40611412680b3445fac
              method: account.status
              params:
                recvWindow: 5000
                timestamp: 1770736694138
                apiKey: API_KEY
      responses:
        Successful Response:
          description: 账户 信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 605a6d20-6588-4cb9-afa0-b0ab087507ba
                  status:
                    type: integer
                    example: 200
                    format: int64
                  result:
                    type: object
                    properties:
                      feeTier:
                        type: integer
                        example: 0
                        format: int64
                        description: 手续费等级
                      canTrade:
                        type: boolean
                        example: true
                        description: 是否可交易
                      canDeposit:
                        type: boolean
                        example: true
                        description: 是否可入金
                      canWithdraw:
                        type: boolean
                        example: true
                        description: 是否可出金
                      updateTime:
                        type: integer
                        example: 0
                        format: int64
                        description: 保留字段，请忽略
                      multiAssetsMargin:
                        type: boolean
                        example: true
                      tradeGroupId:
                        type: integer
                        example: -1
                        format: int64
                      totalInitialMargin:
                        type: string
                        example: '0.00000000'
                        description: total initial margin required with current mark price (useless with isolated positions), only for USDT asset
                      totalMaintMargin:
                        type: string
                        example: '0.00000000'
                        description: 全仓持仓维持保证金总额（USD 计价）。
                      totalWalletBalance:
                        type: string
                        example: '126.72469206'
                        description: 账户总钱包余额，仅 USDT 资产。
                      totalUnrealizedProfit:
                        type: string
                        example: '0.00000000'
                        description: 未实现盈亏总额，仅 USDT 资产。
                      totalMarginBalance:
                        type: string
                        example: '126.72469206'
                        description: 保证金余额总额，仅 USDT 资产。
                      totalPositionInitialMargin:
                        type: string
                        example: '0.00000000'
                        description: initial margin required for positions with current mark price, only for USDT asset
                      totalOpenOrderInitialMargin:
                        type: string
                        example: '0.00000000'
                        description: initial margin required for open orders with current mark price, only for USDT asset
                      totalCrossWalletBalance:
                        type: string
                        example: '126.72469206'
                        description: 全仓钱包余额，仅 USDT 资产。
                      totalCrossUnPnl:
                        type: string
                        example: '0.00000000'
                        description: 全仓持仓未实现盈亏，仅 USDT 资产。
                      availableBalance:
                        type: string
                        example: '126.72469206'
                        description: 可用余额，仅 USDT 资产。
                      maxWithdrawAmount:
                        type: string
                        example: '126.72469206'
                        description: 最大可转出金额，仅 USDT 资产。
                      assets:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                              example: USDT
                              description: 资产名称
                            walletBalance:
                              type: string
                              example: '23.72469206'
                              description: 钱包余额
                            unrealizedProfit:
                              type: string
                              example: '0.00000000'
                              description: 未实现盈亏
                            marginBalance:
                              type: string
                              example: '23.72469206'
                              description: 保证金余额
                            maintMargin:
                              type: string
                              example: '0.00000000'
                              description: 所需维持保证金
                            initialMargin:
                              type: string
                              example: '0.00000000'
                              description: 当前标记价格下所需总起始保证金。
                            positionInitialMargin:
                              type: string
                              example: '0.00000000'
                              description: 当前标记价格下持仓所需起始保证金。
                            openOrderInitialMargin:
                              type: string
                              example: '0.00000000'
                              description: 当前标记价格下挂单所需起始保证金。
                            crossWalletBalance:
                              type: string
                              example: '23.72469206'
                              description: 全仓钱包余额
                            crossUnPnl:
                              type: string
                              example: '0.00000000'
                              description: 全仓持仓未实现盈亏
                            availableBalance:
                              type: string
                              example: '126.72469206'
                              description: 可用余额，仅 USDT 资产。
                            maxWithdrawAmount:
                              type: string
                              example: '23.72469206'
                              description: 最大可转出金额，仅 USDT 资产。
                            marginAvailable:
                              type: boolean
                              example: true
                              description: 该资产是否可在多资产模式下作为保证金。
                            updateTime:
                              type: integer
                              example: 1625474304765
                              format: int64
                              description: 保留字段，请忽略
                      positions:
                        type: array
                        items:
                          type: object
                          properties:
                            symbol:
                              type: string
                              example: BTCUSDT
                              description: 交易对名称
                            initialMargin:
                              type: string
                              example: '0'
                              description: 当前标记价格下所需总起始保证金。
                            maintMargin:
                              type: string
                              example: '0'
                              description: 所需维持保证金
                            unrealizedProfit:
                              type: string
                              example: '0.00000000'
                              description: 未实现盈亏
                            positionInitialMargin:
                              type: string
                              example: '0'
                              description: 当前标记价格下持仓所需起始保证金。
                            openOrderInitialMargin:
                              type: string
                              example: '0'
                              description: 当前标记价格下挂单所需起始保证金。
                            leverage:
                              type: string
                              example: '100'
                              description: 当前初始杠杆
                            isolated:
                              type: boolean
                              example: true
                              description: 是否逐仓持仓
                            entryPrice:
                              type: string
                              example: '0.00000'
                              description: 持仓成本价
                            maxNotional:
                              type: string
                              example: '250000'
                              description: 当前杠杆下最大可用名义价值。
                            bidNotional:
                              type: string
                              example: '0'
                              description: 买单名义价值（忽略）。
                            askNotional:
                              type: string
                              example: '0'
                              description: 卖单名义价值（忽略）。
                            positionSide:
                              type: string
                              example: BOTH
                              description: 持仓方向
                            positionAmt:
                              type: string
                              example: '0'
                              description: 持仓数量
                            updateTime:
                              type: integer
                              example: 0
                              format: int64
                              description: 保留字段，请忽略
                            breakEvenPrice:
                              type: string
                              example: '0.0'
                              description: 持仓成本价
                        description: 返回市场中所有交易对的持仓。
                  rateLimits:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: REQUEST_WEIGHT
                        interval:
                          type: string
                          example: MINUTE
                        intervalNum:
                          type: integer
                          example: 1
                          format: int64
                        limit:
                          type: integer
                          example: 2400
                          format: int64
                        count:
                          type: integer
                          example: 20
                          format: int64
