      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BTCUSDT
        - name: period
          in: query
          required: true
          schema:
            type: string
            example: 5m
            enum:
              - 5m
              - 15m
