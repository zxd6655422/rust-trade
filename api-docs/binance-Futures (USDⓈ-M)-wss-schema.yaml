  /algoOrder.place:
    post:
      summary: 条件单下单 (TRADE)
      description: 条件单下单
      tags:
        - trade
      operationId: newAlgoOrder
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/ws-api/trade#new-algo-order
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/websocket-api/TradeApi/newAlgoOrder.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/websocket_api/trade_api/new_algo_order.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/websocket_api/Trade/new_algo_order.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/websocket/api/trade/NewAlgoOrderExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/websocketapi/TradeAPI/NewAlgoOrder/NewAlgoOrder.go
      x-ip-weight: 0
      x-security-type: TRADE
      x-signed: true
      x-parameters-notes: |-
        - 条件单触发规则：
          - 若 `priceProtect=true`，当价格到达 `triggerPrice` 时，`MARK_PRICE`
            与 `CONTRACT_PRICE` 的价差不能超过该交易对的 `triggerProtect`。
          - `STOP` / `STOP_MARKET`：
            - BUY：最新价 >= `triggerPrice`
            - SELL：最新价 <= `triggerPrice`
          - `TAKE_PROFIT` / `TAKE_PROFIT_MARKET`：
            - BUY：最新价 <= `triggerPrice`
            - SELL：最新价 >= `triggerPrice`
          - `TRAILING_STOP_MARKET`：
            - BUY：最低价 <= `activatePrice` 且最新价 >= 最低价 * (1 + `callbackRate`)
            - SELL：最高价 >= `activatePrice` 且最新价 <= 最高价 * (1 - `callbackRate`)

        - 若 `TRAILING_STOP_MARKET` 返回 `{"code": -2021, "msg": "Order would immediately trigger."}`：
          - BUY：`activatePrice` 必须小于最新价
          - SELL：`activatePrice` 必须大于最新价

        - `STOP_MARKET` / `TAKE_PROFIT_MARKET` 且 `closePosition=true`：
          - 触发后全平当前方向仓位
          - 不可与 `quantity` 同时使用
          - 不可与 `reduceOnly` 同时使用
          - 双向持仓模式下，`LONG` 不支持 `BUY`，`SHORT` 不支持 `SELL`

        - `selfTradePreventionMode` 仅在 `timeInForce` 为 `IOC`、`GTC` 或 `GTD` 时生效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 请求 ID。
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - algoOrder.place
                  example: algoOrder.place
                params:
                  type: object
                  properties:
                    algoType:
                      type: string
                      example: CONDITIONAL
                      enum:
                        - CONDITIONAL
                      description: 仅支持 `CONDITIONAL`。
                    symbol:
                      type: string
                      example: BTCUSDT
                      description: 交易对。
                    side:
                      type: string
                      example: BUY
                      enum:
                        - BUY
                        - SELL
                      description: 买卖方向。
                    positionSide:
                      type: string
                      example: BOTH
                      enum:
                        - BOTH
                        - LONG
                        - SHORT
                      description: 单向模式默认 `BOTH`；双向模式可为 `LONG` 或 `SHORT`，双向模式必传。
                    type:
                      type: string
                      example: STOP_MARKET
                      enum:
                        - STOP_MARKET
                        - TAKE_PROFIT_MARKET
                        - STOP
                        - TAKE_PROFIT
                        - TRAILING_STOP_MARKET
                      description: 当 algoType=`CONDITIONAL` 时，订单类型可为 `STOP_MARKET`/`TAKE_PROFIT_MARKET`/`STOP`/`TAKE_PROFIT`/`TRAILING_STOP_MARKET` 之一。
                    timeInForce:
                      type: string
                      example: GTC
                      enum:
                        - IOC
                        - GTC
                        - FOK
                      description: '`IOC`、`GTC` 或 `FOK`，默认 `GTC`。'
                    quantity:
                      type: number
                      example: '1.0'
                      format: float
                      description: 不可与 `closePosition=true`（全平）同时传。
                    price:
                      type: number
                      example: '1.0'
                      format: float
                      description: 价格。
                    triggerPrice:
                      type: number
                      example: '1.0'
                      format: float
                      description: 触发价格。
                    workingType:
                      type: string
                      example: MARK_PRICE
                      default: CONTRACT_PRICE
                      enum:
                        - MARK_PRICE
                        - CONTRACT_PRICE
                      description: 触发价格类型：`MARK_PRICE` 或 `CONTRACT_PRICE`，默认 `CONTRACT_PRICE`。
                    priceMatch:
                      type: string
                      example: OPPONENT
                      enum:
                        - OPPONENT
                        - OPPONENT_5
                        - OPPONENT_10
                        - OPPONENT_20
                        - QUEUE
                        - QUEUE_5
                        - QUEUE_10
                        - QUEUE_20
                      description: 仅适用于 LIMIT/STOP/TAKE_PROFIT；不可与 price 同时传。
                    closePosition:
                      type: string
                      example: 'true'
                      enum:
                        - 'true'
                        - 'false'
                      description: 全平，仅用于 `STOP_MARKET` 或 `TAKE_PROFIT_MARKET`。
                    priceProtect:
                      type: string
                      example: 'true'
                      default: 'false'
                      enum:
                        - 'true'
                        - 'false'
                      description: 用于 STOP_MARKET 或 TAKE_PROFIT_MARKET；当价格触达 triggerPrice 时，MARK_PRICE 与 CONTRACT_PRICE 的价差比例不得超过该交易对的价格保护阈值。
                    reduceOnly:
                      type: string
                      example: 'true'
                      default: 'false'
                      enum:
                        - 'true'
                        - 'false'
                      description: 双向持仓模式不可传；不可与 closePosition=true 同时传。
                    activatePrice:
                      type: number
                      example: '1.0'
                      format: float
                      description: 仅用于 TRAILING_STOP_MARKET，默认使用最新价（支持不同 workingType）。
                    callbackRate:
                      type: number
                      example: 1
                      format: float
                      minimum: 0.1
                      maximum: 10
                      description: 仅用于 `TRAILING_STOP_MARKET`。
                    clientAlgoId:
                      type: string
                      example: '1'
                      description: 挂单中的唯一客户端订单 ID；未传则自动生成。仅支持匹配 `^[\\.A-Z\\:/a-z0-9_-]{1,36}$` 的字符串。
                    newOrderRespType:
                      type: string
                      example: ACK
                      enum:
                        - ACK
                        - RESULT
                      description: '`ACK` 或 `RESULT`，默认 `ACK`。'
                    selfTradePreventionMode:
                      type: string
                      example: EXPIRE_TAKER
                      enum:
                        - NONE
                        - EXPIRE_TAKER
