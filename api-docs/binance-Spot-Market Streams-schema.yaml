openapi: 3.0.2
info:
  title: Spot WebSocket Market Streams
  description: 访问市场数据、管理账户，并在 Binance 现货市场交易。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: ws-streams
x-untagged-label: true
x-user-data-streams: true
externalDocs:
  description: Spot docs
  url: https://developers.binance.com/en/docs/products/spot
servers:
  - url: wss://stream.binance.com:9443
  - url: wss://stream.binance.com:443
  - url: wss://demo-stream.binance.com:9443
  - url: wss://demo-stream.binance.com:443
  - url: wss://stream.testnet.binance.vision
paths:
  /{symbol}@aggTrade:
    post:
      summary: 归集交易
      description: 归集交易与逐笔交易的区别在于，同一个taker在同一价格与多个maker成交时，会被归集为一笔成交。
      operationId: aggTrade
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/ws-streams/~#agg-trade
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/websocket-streams//aggTrade.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/websocket_streams//agg_trade.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/websocket_streams//agg_trade.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/stream/websocketstreams//AggTradeExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketstreams/WebSocketStreamsAPI//AggTrade/AggTrade.go
      x-update-speed: Real-time
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一的 WebSocket 请求 ID。
        - name: symbol
          in: path
          required: true
          description: 要查询的交易对
          schema:
            type: string
            example: bnbusdt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - bnbusdt@aggTrade
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - bnbusdt@aggTrade
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: 归集交易
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: aggTrade
                    description: 事件类型
                  E:
                    type: integer
                    format: int64
                    example: 1672515782136
                    description: 事件时间
                  s:
                    type: string
                    example: BNBBTC
                    description: 交易对
                  a:
                    type: integer
                    format: int64
                    example: 12345
                    description: 归集交易ID
                  p:
                    type: string
                    example: 0.001
                    description: 成交价格
                  q:
                    type: string
                    example: 100
                    description: 成交数量
                  f:
                    type: integer
                    format: int64
                    example: 100
                    description: 被归集的首个交易ID
                  l:
                    type: integer
                    format: int64
                    example: 105
                    description: 被归集的末次交易ID
                  T:
                    type: integer
                    format: int64
                    example: 1672515782136
                    description: 成交时间
                  m:
                    type: boolean
                    example: true
                    description: 买方是否是做市方。如true，则此次成交是一个主动卖出单，否则是一个主动买入单。
                  M:
                    type: boolean
                    example: true
                    description: 请忽略该字段
              example:
                e: aggTrade
                E: 1672515782136
                s: BNBBTC
                a: 12345
                p: 0.001
                q: 100
                f: 100
                l: 105
                T: 1672515782136
                m: true
                M: true
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: bnbusdt@aggTrade
                  data:
                    type: object
                    properties:
                      e:
                        type: string
                        example: aggTrade
                        description: 事件类型
                      E:
                        type: integer
                        format: int64
                        example: 1672515782136
                        description: 事件时间
                      s:
                        type: string
                        example: BNBBTC
                        description: 交易对
                      a:
                        type: integer
                        format: int64
                        example: 12345
                        description: 归集交易ID
                      p:
                        type: string
                        example: 0.001
                        description: 成交价格
                      q:
                        type: string
                        example: 100
                        description: 成交数量
                      f:
                        type: integer
                        format: int64
                        example: 100
                        description: 被归集的首个交易ID
                      l:
                        type: integer
                        format: int64
                        example: 105
                        description: 被归集的末次交易ID
                      T:
                        type: integer
                        format: int64
                        example: 1672515782136
                        description: 成交时间
                      m:
                        type: boolean
                        example: true
                        description: 买方是否是做市方。如true，则此次成交是一个主动卖出单，否则是一个主动买入单。
                      M:
                        type: boolean
                        example: true
                        description: 请忽略该字段
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: bnbusdt@aggTrade
                data:
                  e: aggTrade
                  E: 1672515782136
                  s: BNBBTC
                  a: 12345
                  p: 0.001
                  q: 100
                  f: 100
                  l: 105
                  T: 1672515782136
                  m: true
                  M: true
  /!ticker_{windowSize}@arr:
    post:
      summary: 全市场滚动窗口统计
      description: |-
        全市场symbols的滚动窗口ticker统计，计算于多个窗口。

        注意：有变动的ticker才会推送。
      operationId: allMarketRollingWindowTicker
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/ws-streams/~#all-market-rolling-window-ticker
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/websocket-streams//allMarketRollingWindowTicker.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/websocket_streams//all_market_rolling_window_ticker.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/websocket_streams//all_market_rolling_window_ticker.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/stream/websocketstreams//AllMarketRollingWindowTickerExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketstreams/WebSocketStreamsAPI//AllMarketRollingWindowTicker/AllMarketRollingWindowTicker.go
      x-update-speed: 1000ms
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一的 WebSocket 请求 ID。
        - name: windowSize
          in: path
          required: true
          schema:
            type: string
            example: 1h
            enum:
              - 1h
              - 4h
              - 1d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - '!ticker_1h@arr'
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - '!ticker_1h@arr'
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: 全市场滚动窗口统计
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    e:
                      type: string
                      example: 1hTicker
                      description: 事件类型
                    E:
                      type: integer
                      format: int64
                      example: 1672515782136
                      description: 事件时间
                    s:
                      type: string
                      example: BNBBTC
                      description: 交易对
                    p:
                      type: string
                      example: 0.0015
                      description: 价格变化
                    P:
                      type: string
                      example: 250
                      description: 价格变化百分比
                    o:
                      type: string
                      example: 0.001
                      description: 开盘价
                    h:
                      type: string
                      example: 0.0025
                      description: 最高价
                    l:
                      type: string
                      example: 0.001
                      description: 最低价
                    c:
                      type: string
                      example: 0.0025
                      description: 最新价
                    w:
                      type: string
                      example: 0.0018
                      description: 加权平均价格
                    v:
                      type: string
                      example: 10000
                      description: 总成交基础资产量
                    q:
                      type: string
                      example: 18
                      description: 总成交计价资产量
                    O:
                      type: integer
                      format: int64
                      example: 0
                      description: 统计开始时间
                    C:
                      type: integer
                      format: int64
                      example: 1675216573749
                      description: 统计结束时间
                    F:
                      type: integer
                      format: int64
                      example: 0
                      description: 第一笔成交ID
                    L:
                      type: integer
                      format: int64
                      example: 18150
                      description: 最后一笔成交ID
                    'n':
                      type: integer
                      format: int64
                      example: 18151
                      description: 总成交笔数
              example:
                - e: 1hTicker
                  E: 1672515782136
                  s: BNBBTC
                  p: 0.0015
                  P: 250
                  o: 0.001
                  h: 0.0025
                  l: 0.001
                  c: 0.0025
                  w: 0.0018
                  v: 10000
                  q: 18
                  O: 0
                  C: 1675216573749
                  F: 0
                  L: 18150
                  'n': 18151
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: '!ticker_1h@arr'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        e:
                          type: string
                          example: 1hTicker
                          description: 事件类型
                        E:
                          type: integer
                          format: int64
                          example: 1672515782136
                          description: 事件时间
                        s:
                          type: string
                          example: BNBBTC
                          description: 交易对
                        p:
                          type: string
                          example: 0.0015
                          description: 价格变化
                        P:
                          type: string
                          example: 250
                          description: 价格变化百分比
                        o:
                          type: string
                          example: 0.001
                          description: 开盘价
                        h:
                          type: string
                          example: 0.0025
                          description: 最高价
                        l:
                          type: string
                          example: 0.001
                          description: 最低价
                        c:
                          type: string
                          example: 0.0025
                          description: 最新价
                        w:
                          type: string
                          example: 0.0018
                          description: 加权平均价格
                        v:
                          type: string
                          example: 10000
                          description: 总成交基础资产量
                        q:
                          type: string
                          example: 18
                          description: 总成交计价资产量
                        O:
                          type: integer
                          format: int64
                          example: 0
                          description: 统计开始时间
                        C:
                          type: integer
                          format: int64
                          example: 1675216573749
                          description: 统计结束时间
                        F:
                          type: integer
                          format: int64
                          example: 0
                          description: 第一笔成交ID
                        L:
                          type: integer
                          format: int64
                          example: 18150
                          description: 最后一笔成交ID
                        'n':
                          type: integer
                          format: int64
                          example: 18151
                          description: 总成交笔数
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: '!ticker_1h@arr'
                data:
                  - e: 1hTicker
                    E: 1672515782136
                    s: BNBBTC
                    p: 0.0015
                    P: 250
                    o: 0.001
                    h: 0.0025
                    l: 0.001
                    c: 0.0025
                    w: 0.0018
                    v: 10000
                    q: 18
                    O: 0
                    C: 1675216573749
                    F: 0
                    L: 18150
                    'n': 18151
  /!miniTicker@arr:
    post:
      summary: 全市场迷你行情Stream
      description: 所有交易对的24小时滚动窗口迷你行情统计，以数组形式推送。这些不是UTC日统计数据，而是过去24小时的滚动窗口。注意，只有发生变化的行情才会出现在数组中。
      operationId: allMiniTicker
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/ws-streams/~#all-mini-ticker
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/websocket-streams//allMiniTicker.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/websocket_streams//all_mini_ticker.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/websocket_streams//all_mini_ticker.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/stream/websocketstreams//AllMiniTickerExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketstreams/WebSocketStreamsAPI//AllMiniTicker/AllMiniTicker.go
      x-update-speed: 1000ms
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一的 WebSocket 请求 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - '!miniTicker@arr'
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - '!miniTicker@arr'
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: All Market Mini 行情s Stream
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    e:
                      type: string
                      example: 24hrMiniTicker
                      description: 事件类型
                    E:
                      type: integer
                      format: int64
                      example: 1672515782136
                      description: 事件时间
                    s:
                      type: string
                      example: BNBBTC
                      description: 交易对
                    c:
                      type: string
                      example: 0.0025
                      description: 最新成交价格
                    o:
                      type: string
                      example: 0.001
                      description: 24小时前开始第一笔成交价格
                    h:
                      type: string
                      example: 0.0025
                      description: 24小时内最高成交价
                    l:
                      type: string
                      example: 0.001
                      description: 24小时内最低成交价
                    v:
                      type: string
                      example: 10000
                      description: 成交量
                    q:
                      type: string
                      example: 18
                      description: 成交额
              example:
                - e: 24hrMiniTicker
                  E: 1672515782136
                  s: BNBBTC
                  c: 0.0025
                  o: 0.001
                  h: 0.0025
                  l: 0.001
                  v: 10000
                  q: 18
        Combined Stream:
          description: Stream payload with stream name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    type: string
                    example: '!miniTicker@arr'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        e:
                          type: string
                          example: 24hrMiniTicker
                          description: 事件类型
                        E:
                          type: integer
                          format: int64
                          example: 1672515782136
                          description: 事件时间
                        s:
                          type: string
                          example: BNBBTC
                          description: 交易对
                        c:
                          type: string
                          example: 0.0025
                          description: 最新成交价格
                        o:
                          type: string
                          example: 0.001
                          description: 24小时前开始第一笔成交价格
                        h:
                          type: string
                          example: 0.0025
                          description: 24小时内最高成交价
                        l:
                          type: string
                          example: 0.001
                          description: 24小时内最低成交价
                        v:
                          type: string
                          example: 10000
                          description: 成交量
                        q:
                          type: string
                          example: 18
                          description: 成交额
                required:
                  - stream
                  - data
                additionalProperties: false
              example:
                stream: '!miniTicker@arr'
                data:
                  - e: 24hrMiniTicker
                    E: 1672515782136
                    s: BNBBTC
                    c: 0.0025
                    o: 0.001
                    h: 0.0025
                    l: 0.001
                    v: 10000
                    q: 18
  /{symbol}@avgPrice:
