openapi: 3.0.2
info:
  title: Futures (USDⓈ-M) REST API
  description: 访问市场数据、管理账户，并交易 USDⓈ-M 永续合约。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: rest-api
x-rate-limits-guide: products/derivatives-trading-usds-futures/general-info#访问限制
x-security-guide: products/derivatives-trading-usds-futures/general-info#接口鉴权类型
x-api-key-guide: https://www.binance.com/cn/support/faq/detail/360002502072
externalDocs:
  description: Futures (USDⓈ-M) docs
  url: https://developers.binance.com/en/docs/products/derivatives-trading-usds-futures/general-info
tags:
  - name: account
    x-displayName: 账户接口
  - name: convert
    x-displayName: 合约钱包闪兑
  - name: market-data
    x-displayName: 行情接口
  - name: portfolio-margin-endpoints
    x-displayName: 经典统一账户接口
  - name: trade
    x-displayName: 交易接口
  - name: user-data-streams
    x-displayName: Websocket账户信息推送
servers:
  - url: https://fapi.binance.com
  - url: https://testnet.binancefuture.com
paths:
  /fapi/v2/account:
    get:
      summary: 账户信息V2
      description: 现有账户信息。 用户在单资产模式和多资产模式下会看到不同结果，响应部分的注释解释了两种模式下的不同。
      tags:
        - account
      operationId: accountInformationV2
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/rest-api/account#account-information-v2
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/rest-api/AccountApi/accountInformationV2.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/rest_api/account_api/account_information_v2.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/rest_api/Account/account_information_v2.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/rest/account/AccountInformationV2Example.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/restapi/AccountAPI/AccountInformationV2/AccountInformationV2.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-usds-futures/account/AccountInformationV2Example.php
      x-ip-weight: 5
      x-security-type: USER_DATA
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
        - name: recvWindow
          in: query
          required: false
          schema:
            type: integer
            example: 5000
            maximum: 60000
            format: int64
        - name: timestamp
          in: query
          required: true
          schema:
            type: integer
            example: 1770736694138
            format: int64
          description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: 账户 信息 V2
          content:
            application/json:
              schema:
                type: object
                properties:
                  feeTier:
                    type: integer
                    example: 0
                    format: int64
                    description: 手续费等级。
                  feeBurn:
                    type: boolean
                    example: true
                    description: 是否开启手续费抵扣。
                  canTrade:
                    type: boolean
                    example: true
                    description: 是否可以交易。
                  canDeposit:
                    type: boolean
                    example: true
                    description: 是否可以入金。
                  canWithdraw:
                    type: boolean
                    example: true
                    description: 是否可以出金。
                  updateTime:
                    type: integer
                    example: 0
                    format: int64
                    description: 保留字段，可忽略。
                  multiAssetsMargin:
                    type: boolean
                    example: true
                    description: 是否开启多资产模式。
                  tradeGroupId:
                    type: integer
                    example: -1
                    format: int64
                    description: 交易组 ID。
                  totalInitialMargin:
                    type: string
                    example: '0.00000000'
                    description: 起始保证金总额。
                  totalMaintMargin:
                    type: string
                    example: '0.00000000'
                    description: 维持保证金总额。
                  totalWalletBalance:
                    type: string
                    example: '126.72469206'
                    description: 账户总余额。
                  totalUnrealizedProfit:
                    type: string
                    example: '0.00000000'
                    description: 持仓未实现盈亏总额。
                  totalMarginBalance:
                    type: string
                    example: '126.72469206'
                    description: 保证金总余额。
                  totalPositionInitialMargin:
                    type: string
                    example: '0.00000000'
                    description: 持仓所需起始保证金。
                  totalOpenOrderInitialMargin:
                    type: string
                    example: '0.00000000'
                    description: 当前挂单所需起始保证金。
                  totalCrossWalletBalance:
                    type: string
                    example: '126.72469206'
                    description: 全仓账户余额。
                  totalCrossUnPnl:
                    type: string
                    example: '0.00000000'
                    description: 全仓持仓未实现盈亏总额。
                  availableBalance:
                    type: string
                    example: '126.72469206'
                    description: 可用余额。
                  maxWithdrawAmount:
                    type: string
                    example: '126.72469206'
                    description: 最大可转出余额。
                  assets:
                    type: array
                    description: 资产维度账户信息。
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          example: USDT
                          description: 资产名称。
                        walletBalance:
                          type: string
                          example: '23.72469206'
                          description: 钱包余额。
                        unrealizedProfit:
                          type: string
                          example: '0.00000000'
                          description: 未实现盈亏。
                        marginBalance:
                          type: string
                          example: '23.72469206'
                          description: 保证金余额。
                        maintMargin:
                          type: string
                          example: '0.00000000'
                          description: 维持保证金。
                        initialMargin:
                          type: string
                          example: '0.00000000'
                          description: 所需起始保证金。
                        positionInitialMargin:
                          type: string
                          example: '0.00000000'
                          description: 持仓所需起始保证金。
                        openOrderInitialMargin:
                          type: string
                          example: '0.00000000'
                          description: 当前挂单所需起始保证金。
                        crossWalletBalance:
                          type: string
                          example: '23.72469206'
                          description: 全仓账户余额。
                        crossUnPnl:
                          type: string
                          example: '0.00000000'
                          description: 全仓持仓未实现盈亏。
                        availableBalance:
                          type: string
                          example: '126.72469206'
                          description: 可用余额。
                        maxWithdrawAmount:
                          type: string
                          example: '23.72469206'
                          description: 最大可转出余额。
                        marginAvailable:
                          type: boolean
                          example: true
                          description: 在多资产模式下，该资产是否可作为保证金。
                        updateTime:
                          type: integer
                          example: 1625474304765
                          format: int64
                          description: 最后更新时间（毫秒）。
                  positions:
                    type: array
                    description: 各交易对持仓信息。单向模式返回 BOTH，双向模式返回 LONG/SHORT。
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                          example: BTCUSDT
                          description: 交易对。
                        initialMargin:
                          type: string
                          example: '0'
                          description: 所需起始保证金。
                        maintMargin:
                          type: string
                          example: '0'
                          description: 维持保证金。
                        unrealizedProfit:
                          type: string
                          example: '0.00000000'
                          description: 持仓未实现盈亏。
                        positionInitialMargin:
                          type: string
                          example: '0'
                          description: 持仓所需起始保证金。
                        openOrderInitialMargin:
                          type: string
                          example: '0'
                          description: 当前挂单所需起始保证金。
                        leverage:
                          type: string
                          example: '100'
                          description: 当前杠杆倍数。
                        isolated:
                          type: boolean
                          example: true
                          description: 是否为逐仓模式。
                        entryPrice:
                          type: string
                          example: '0.00000'
                          description: 持仓成本价。
                        maxNotional:
                          type: string
                          example: '250000'
                          description: 当前杠杆下可用最大名义价值。
                        bidNotional:
                          type: string
                          example: '0'
                          description: 买单名义价值（可忽略）。
                        askNotional:
                          type: string
                          example: '0'
                          description: 卖单名义价值（可忽略）。
                        positionSide:
                          type: string
                          example: BOTH
                          description: 持仓方向。
                        positionAmt:
                          type: string
                          example: '0'
                          description: 持仓数量。
                        updateTime:
                          type: integer
                          example: 0
                          format: int64
                          description: 最后更新时间（毫秒）。
                      description: 头寸，将返回所有市场symbol。
