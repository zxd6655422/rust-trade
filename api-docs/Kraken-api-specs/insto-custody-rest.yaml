e task to advance.","type":"integer","format":"int32","example":2}},"required":["approved","denied","undecided"]},"current_user_decision":{"description":"The caller's own decision on this task. One of `undecided`, `approved`, `denied`.","type":"string","example":"undecided"},"vault_info":{"description":"Vault the task is scoped to. Omitted for domain-level tasks that do not target a specific vault.","type":"object","properties":{"id":{"description":"Vault identifier, a `V`-prefixed 14-char base32 string with a final check character.","type":"string","example":"VABCDEF234567A"},"name":{"description":"Display name of the vault.","type":"string","example":"Treasury Vault"},"status":{"description":"Current vault lifecycle status (lowercase, e.g. `active`, `archived`).","type":"string","example":"active"},"subquorum_config":{"description":"Vault's current subquorum policy, the group structure used to compute approvals on multi-quorum tasks.","type":"object","properties":{"groups":{"description":"Subquorum groups defined on the vault. A multi-quorum task advances when each group's `required` count of approvals is met.","type":"array","items":{"type":"object","properties":{"id":{"description":"Subquorum group identifier (UUID v4).","type":"string","example":"11111111-2222-4333-8444-555555555555"},"required":{"description":"Number of group members whose approval is needed to satisfy this group's quorum.","type":"integer","format":"int32","example":2},"members":{"description":"Members of the subquorum group.","type":"array","items":{"type":"object","properties":{"iiban":{"description":"16-char IIBAN of the group member.","type":"string","example":"ABCD EFGH IJKL MNOP"},"full_name":{"description":"Display name of the member, when resolvable at read time.","type":"string","example":"Jane Doe"},"email":{"description":"Email address of the member, when resolvable at read time.","type":"string","example":"jane.doe@example.com"},"role":{"description":"Role of the member at read time (lowercase).","type":"string","example":"admin"}},"required":["iiban"]}}},"required":["id","required","members"]}}},"required":["groups"]}},"required":["id"]},"reviewer_statistics_label":{"description":"Indicates which reviewer-tally field to consult. `standard` means use `reviewer_statistics`; `multiquorum` means use `subquorum_approvals`.","type":"string","example":"standard"},"instruction_types":{"description":"The set of action types bundled into the task. These are the same singular action names accepted by the `action` query filter, so a value here can be passed straight back as a filter.","type":"array","items":{"type":"string","enum":["update_subquorum","update_vault_user","update_vault_policy","request_withdrawal","remove_org_user","create_user","request_staking_allocation","update_withdrawal_address","update_user_permission","create_vault","update_vault","update_domain_policy","update_user_status","request_transfer_to_spot","create_api_user","update_api_user","request_staking_deallocation","request_custody_transfer_to_spot","request_pledge","request_pledge_release"],"description":"Action type of one instruction in the task.","example":"request_withdrawal"}},"subquorum_snapshot":{"description":"Subquorum policy snapshot taken when the task was created. Approvals are evaluated against this snapshot so a later policy change cannot retroactively invalidate decisions already cast.","type":"object","properties":{"groups":{"description":"Subquorum groups captured in the snapshot.","type":"array","items":{"type":"object","properties":{"id":{"description":"Subquorum group identifier (UUID v4).","type":"string","example":"11111111-2222-4333-8444-555555555555"},"required":{"description":"Number of group members whose approval is needed to satisfy this group's quorum.","type":"integer","format":"int32","example":2},"members":{"description":"Members of the subquorum group as captured at task-creation time.","type":"array","items":{"type":"object","properties":{"iiba