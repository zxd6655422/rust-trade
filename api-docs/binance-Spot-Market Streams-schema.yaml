              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - bnbusdt@kline_1s
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: UTC K线
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: kline
                    description: 事件类型
                  E:
                    type: integer
                    format: int64
                    example: 1672515782136
                    description: 事件时间
                  s:
                    type: string
                    example: BNBBTC
                    description: 交易对
                  k:
                    type: object
                    description: K线数据
                    properties:
                      t:
                        type: integer
                        format: int64
                        example: 1672515780000
                        description: 该K线的起始时间
                      T:
                        type: integer
                        format: int64
                        example: 1672515839999
                        description: 该K线的结束时间
                      s:
                        type: string
                        example: BNBBTC
                        description: 交易对
                      i:
                        type: string
                        example: 1m
                        description: K线间隔
                      f:
                        type: integer
                        format: int64
                        example: 100
                        description: 该K线期间第一笔成交ID
                      L:
                        type: integer
                        format: int64
                        example: 200
                        description: 该K线期间末一笔成交ID
                      o:
                        type: string
                        example: 0.001
                        description: 该K线期间第一笔成交价
                      c:
                        type: string
                        example: 0.002
                        description: 该K线期间末一笔成交价
                      h:
                        type: string
                        example: 0.0025
                        description: 该K线期间最高成交价
