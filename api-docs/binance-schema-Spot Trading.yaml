      x-security-type: USER_DATA
      x-signed: true
      x-weight: |-
        Condition| Weight|
        ---| ---
        |Without orderId|20|
        |With orderId|5|
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: BNBBTC
        - name: orderId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            example: 100234
          description: 必须要和参数`symbol`一起使用。
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            example: 1735693200000
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            example: 1735693200000
        - name: fromId
          in: query
          required: false
          description: 返回该fromId之后的成交，缺省返回最近的成交
          schema:
            type: integer
            format: int64
            example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 1
            default: 500
            maximum: 1000
        - name: recvWindow
          in: query
          required: false
          description: 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
