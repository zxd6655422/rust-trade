  /fapi/v2/balance:
    get:
      summary: 账户余额V2
      description: 查询账户余额信息。
      tags:
        - account
      operationId: futuresAccountBalanceV2
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/rest-api/account#futures-account-balance-v2
