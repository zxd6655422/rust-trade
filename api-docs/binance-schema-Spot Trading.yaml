        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/restapi/TradeAPI/NewOrder/NewOrder.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/spot/trade/NewOrderExample.php
      x-ip-weight: 1
      x-order-weight: 1
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
      x-parameters-notes: |-
        **数据源:** 撮合引擎

        根据 order `type`的不同，某些参数 有强制要求，具体如下:

        Type | 强制要求的参数 | 其他信息
        ------------ | ------------ | ------------
        `LIMIT` | `timeInForce`, `quantity`, `price`
        `MARKET` | `quantity` |  市价买卖单可用`quantity`参数来设置`base asset`数量.<br/> 例如：BTCUSDT 市价单，BTC 买卖数量取决于`quantity`参数. <br/><br/>市价买卖单可用`quoteOrderQty`参数来设置`quote asset`数量. 正确的`quantity`取决于市场的流动性与`quoteOrderQty`<br/> 例如: 市价 `BUY` BTCUSDT，单子会基于`quoteOrderQty`- USDT 的数量，购买 BTC.<br/> 市价 `SELL` BTCUSDT，单子会卖出 BTC 来满足`quoteOrderQty`- USDT 的数量.
        `STOP_LOSS` | `quantity`, `stopPrice`, `trailingDelta` | 条件满足后会下`MARKET`单子. (例如：达到`stopPrice`或`trailingDelta`被启动)
        `STOP_LOSS_LIMIT` | `timeInForce`, `quantity`,  `price`, `stopPrice`, `trailingDelta`
        `TAKE_PROFIT` | `quantity`, `stopPrice`, `trailingDelta` | 条件满足后会下`MARKET`单子. (例如：达到`stopPrice`或`trailingDelta`被启动)
        `TAKE_PROFIT_LIMIT` | `timeInForce`, `quantity`, `price`, `stopPrice`, `trailingDelta`
        `LIMIT_MAKER` | `quantity`, `price` | 订单大部分情况下与普通的限价单没有区别，但是如果在当前价格会立即吃对手单并成交则下单会被拒绝。因此使用这个订单类型可以保证订单一定是挂单方，不会成为吃单方。


        关于挂钩订单参数的注意事项：
        * 这些参数仅适用于 `LIMIT`， `LIMIT_MAKER`， `STOP_LOSS_LIMIT` 和 `TAKE_PROFIT_LIMIT` 订单。
        * 如果使用了 `pegPriceType`， 那么 `price` 字段将是可选的。 否则，`price` 字段依旧是必须的。
        * `pegPriceType=PRIMARY_PEG` 就是主要挂钩（`primary`），这是订单簿上与您的订单同一方向的最佳价格。
        * `pegPriceType=MARKET_PEG` 就是市场挂钩（`market`），这是订单簿上与您的订单相反方向的最佳价格。
        * 可以通过使用 `pegOffsetType` 和 `pegOffsetValue` 来获取最佳价格以外的价格水平。 这两个参数必须一起使用。

        其他:
        * 任何`LIMIT`或`LIMIT_MAKER`只要填`icebergQty`参数都可以下冰上订单。
        * 冰山订单的 `timeInForce`必须设置为`GTC`。
        * `STOP_LOSS`, `STOP_LOSS_LIMIT`, `TAKE_PROFIT_LIMIT` 与 `TAKE_PROFIT` 单子都能同时填上`trailingDelta`与`stopPrice`。
        * 填上`quoteOrderQty`的市价单不会触犯过滤器的`LOT_SIZE`限制。订单的`quantity`会尽量满足`quoteOrderQty`的数量。

        条件单的触发价格必须:
        * 比下单时当前市价高: `STOP_LOSS` `BUY`, `TAKE_PROFIT` `SELL`
        * 比下单时当前市价低: `STOP_LOSS` `SELL`, `TAKE_PROFIT` `BUY`
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - symbol
                - side
                - type
                - timestamp
              properties:
                symbol:
                  type: string
                  example: BNBUSDT
                side:
                  type: string
                  enum:
                    - BUY
                    - SELL
                  example: BUY
                  description: 详见枚举定义：[订单方向](/products/spot/enums#side)
                type:
                  type: string
                  enum:
                    - MARKET
                    - LIMIT
                    - STOP_LOSS
                    - STOP_LOSS_LIMIT
                    - TAKE_PROFIT
                    - TAKE_PROFIT_LIMIT
                    - LIMIT_MAKER
                  example: MARKET
                  description: 详见枚举定义：[订单类型](/products/spot/enums#ordertypes)
                timeInForce:
                  type: string
                  enum:
                    - GTC
                    - IOC
                    - FOK
                  example: GTC
                  description: 详见枚举定义：[生效时间](/products/spot/enums#timeinforce)
                quantity:
                  type: number
                  format: float
                  example: 1
                quoteOrderQty:
                  type: number
                  format: float
                  example: 1
                price:
                  type: number
                  format: float
                  example: 400
                newClientOrderId:
                  type: string
                  example: myOrder1
                  description: 用户自定义的orderid，如空缺系统会自动赋值。
                strategyId:
                  type: integer
                  format: int64
                  example: 1
                strategyType:
                  type: integer
                  example: 1
                  minimum: 1000000
                  description: 不能低于 `1000000`。
                stopPrice:
                  type: number
                  format: float
                  example: 1
                  description: 仅 `STOP_LOSS`, `STOP_LOSS_LIMIT`, `TAKE_PROFIT`, `TAKE_PROFIT_LIMIT` 需要此参数。
                trailingDelta:
                  type: integer
                  format: int64
                  example: 1
                  description: 参见 追踪止盈止损(Trailing Stop)订单常见问题
                icebergQty:
                  type: number
                  format: float
                  example: 1
                  description: 仅有限价单(包括条件限价单与限价做事单)可以使用该参数，含义为创建冰山订单并指定冰山订单的数量。
                newOrderRespType:
                  type: string
                  example: ACK
                  enum:
                    - ACK
                    - RESULT
                    - FULL
                  description: '`MARKET` 与 `LIMIT` 订单默认为`FULL`, 其他默认为`ACK`。'
                selfTradePreventionMode:
                  type: string
                  enum:
                    - NONE
                    - EXPIRE_TAKER
                    - EXPIRE_MAKER
                    - EXPIRE_BOTH
                    - DECREMENT
                    - TRANSFER
                  example: NONE
                  description: 允许的 ENUM 取决于交易对的配置。
                pegPriceType:
                  type: string
                  enum:
                    - PRIMARY_PEG
                    - MARKET_PEG
                  example: PRIMARY_PEG
                  description: 参阅 关于挂钩订单参数的注意事项
                pegOffsetValue:
                  type: integer
                  example: 1
                  maximum: 100
                  description: 用于挂钩的价格水平（最大值：100）。参阅 关于挂钩订单参数的注意事项
                pegOffsetType:
                  type: string
                  enum:
                    - PRICE_LEVEL
                  example: PRICE_LEVEL
                  description: 仅支持 `PRICE_LEVEL`。参阅 关于挂钩订单参数的注意事项
                recvWindow:
                  type: number
                  format: float
                  example: 5000
                  maximum: 60000
                  description: 最大值为 `60000` 毫秒。 <br> 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
