        - 如果设置了 `fromId`, 会返回ID大于此 `fromId` 的交易. 不然则会返回最近的交易。
        - `startTime` 和 `endTime` 设置的时间间隔不能超过24小时。
        - 支持的所有参数组合:
          - `symbol`
          - `symbol` + `orderId`
          - `symbol` + `startTime`
          - `symbol` + `endTime`
