  /order.cancelReplace:
    post:
      summary: 撤消挂单再下单 (TRADE)
      description: |-
        * 撤消一个现有订单，并立即重新下单。
        * 即使新订单未被尝试（即 `newOrderResult: NOT_ATTEMPTED`），未成交订单数量仍会增加1。
        * 通过此接口只能撤消订单列表中的单个订单，但结果与撤消整个订单列表相同。
      tags:
        - trade
      operationId: orderCancelReplace
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/ws-api/trade#order-cancel-replace
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/websocket-api/TradeApi/orderCancelReplace.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/websocket_api/trade_api/order_cancel_replace.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/websocket_api/Trade/order_cancel_replace.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/api/trade/OrderCancelReplaceExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketapi/TradeAPI/OrderCancelReplace/OrderCancelReplace.go
      x-ip-weight: 1
      x-order-weight: 1
      x-security-type: TRADE
      x-signed: true
      x-parameters-notes: |-
        **数据源:** 撮合引擎

        类似于 [`order.place`](#order-place) 请求，额外的强制参数 (*) 由新订单的 `type` 确定。

        可用的 `cancelReplaceMode` 选项：

        * `STOP_ON_FAILURE` – 如果撤销订单请求失败，将不会尝试下新订单。
        * `ALLOW_FAILURE` – 即使撤销订单请求失败，也会尝试下新订单。

        <table>
        <thead>
            <tr>
                <th colspan=3 align=left>请求</th>
                <th colspan=3 align=left>响应</th>
            </tr>
            <tr>
                <th><code>cancelReplaceMode</code></th>
                <th><code>orderRateLimitExceededMode</code></th>
                <th>未成交订单数</th>
                <th><code>cancelResult</code></th>
                <th><code>newOrderResult</code></th>
                <th><code>status</code></th>
            </tr>
        </thead>
