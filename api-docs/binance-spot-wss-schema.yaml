openapi: 3.0.2
info:
  title: Spot WebSocket API
  description: 访问市场数据、管理账户，并在 Binance 现货市场交易。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: ws-api
x-rate-limits-guide: products/spot/websocket-api#rate-limits
x-security-guide: products/spot/websocket-api#请求鉴权类型
x-api-key-guide: https://www.binance.com/cn/support/faq/detail/360002502072
x-user-data-streams: true
externalDocs:
  description: Spot docs
  url: https://developers.binance.com/en/docs/products/spot
tags:
  - name: general
    x-displayName: 通用
  - name: market
    x-displayName: 行情
  - name: auth
    x-displayName: 身份验证
  - name: trade
    x-displayName: 交易
  - name: account
    x-displayName: 账户
  - name: user-data-stream
    x-displayName: 用户数据流
servers:
  - url: wss://ws-api.binance.com:443/ws-api/v3
  - url: wss://demo-ws-api.binance.com:443/ws-api/v3
  - url: wss://ws-api.testnet.binance.vision:443/ws-api/v3
paths:
  /account.commission:
    post:
      summary: 账户佣金费率 (USER_DATA)
      description: 获取当前账户的佣金费率。
      tags:
        - account
      operationId: accountCommission
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/ws-api/account#account-commission
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/websocket-api/AccountApi/accountCommission.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/websocket_api/account_api/account_commission.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/websocket_api/Account/account_commission.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/api/account/AccountCommissionExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketapi/AccountAPI/AccountCommission/AccountCommission.go
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      x-parameters-notes: '**数据源:** 数据库'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: 客户端生成的请求标识符。
                  example: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - account.commission
                  example: account.commission
                params:
                  type: object
                  properties:
                    symbol:
                      type: string
                      example: BNBUSDT
                    timestamp:
                      type: integer
                      example: 1770736694138
                      format: int64
                      description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
                    apiKey:
                      type: string
                      description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
                      example: API_KEY
                  additionalProperties: false
                  required:
                    - symbol
                    - timestamp
                    - apiKey
              required:
                - id
                - method
                - params
              additionalProperties: false
            example:
              id: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
              method: account.commission
              params:
                symbol: BNBUSDT
                timestamp: 1770736694138
                apiKey: API_KEY
      responses:
        Successful Response:
          description: 账户佣金费率
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: d3df8a61-98ea-4fe0-8f4e-0fcea5d418b0
                  status:
                    type: integer
                    format: int64
                    example: 200
                  result:
                    type: object
                    properties:
                      symbol:
                        type: string
                        example: BTCUSDT
                      standardCommission:
                        type: object
                        description: 订单成交的标准佣金率。
                        properties:
                          maker:
                            type: string
                            example: '0.00000010'
                          taker:
                            type: string
                            example: '0.00000020'
                          buyer:
                            type: string
                            example: '0.00000030'
                          seller:
                            type: string
                            example: '0.00000040'
                      specialCommission:
                        type: object
                        description: 订单成交的特殊佣金率。
                        properties:
                          maker:
                            type: string
                            example: '0.01000000'
                          taker:
                            type: string
                            example: '0.02000000'
                          buyer:
                            type: string
                            example: '0.03000000'
                          seller:
                            type: string
                            example: '0.04000000'
                      taxCommission:
                        type: object
                        description: 订单成交的税费率。
                        properties:
                          maker:
                            type: string
                            example: 0.00000112
                          taker:
                            type: string
                            example: 0.00000114
                          buyer:
                            type: string
                            example: 0.00000118
                          seller:
                            type: string
                            example: 0.00000116
                      discount:
                        type: object
                        description: 使用 BNB 支付时的标准佣金折扣信息。
                        properties:
                          enabledForAccount:
                            type: boolean
                            example: true
                          enabledForSymbol:
                            type: boolean
                            example: true
                          discountAsset:
                            type: string
                            example: BNB
                          discount:
                            type: string
                            example: '0.75000000'
                            description: 当用BNB支付佣金时，在标准佣金上按此比率打折。
                  rateLimits:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: REQUEST_WEIGHT
                        interval:
                          type: string
                          example: MINUTE
                        intervalNum:
                          type: integer
                          format: int64
                          example: 1
                        limit:
                          type: integer
                          format: int64
                          example: 6000
                        count:
                          type: integer
                          format: int64
                          example: 321
  /account.rateLimits.orders:
    post:
      summary: 查询未成交的订单计数 (USER_DATA)
      description: 显示用户在所有时间间隔内的未成交订单计数。
      tags:
        - account
      operationId: accountRateLimitsOrders
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/ws-api/account#account-rate-limits-orders
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/websocket-api/AccountApi/accountRateLimitsOrders.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/websocket_api/account_api/account_rate_limits_orders.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/websocket_api/Account/account_rate_limits_orders.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/api/account/AccountRateLimitsOrdersExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketapi/AccountAPI/AccountRateLimitsOrders/AccountRateLimitsOrders.go
      x-ip-weight: 40
      x-security-type: USER_DATA
      x-signed: true
      x-parameters-notes: '**数据源:** 缓存'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: 客户端生成的请求标识符。
                  example: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - account.rateLimits.orders
                  example: account.rateLimits.orders
                params:
                  type: object
                  properties:
                    recvWindow:
                      type: number
                      format: float
                      example: 5000
                      maximum: 60000
                      description: 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
                    timestamp:
                      type: integer
                      example: 1770736694138
                      format: int64
                      description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
                    apiKey:
                      type: string
                      description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
                      example: API_KEY
                  additionalProperties: false
                  required:
                    - timestamp
                    - apiKey
              required:
                - id
                - method
                - params
              additionalProperties: false
            example:
              id: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
              method: account.rateLimits.orders
              params:
                recvWindow: 5000
                timestamp: 1770736694138
                apiKey: API_KEY
      responses:
        Successful Response:
          description: 查询未成交的订单计数
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: d3783d8d-f8d1-4d2c-b8a0-b7596af5a664
                  status:
                    type: integer
                    format: int64
                    example: 200
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: ORDERS
                        interval:
                          type: string
                          example: SECOND
                        intervalNum:
                          type: integer
                          format: int64
                          example: 10
                        limit:
                          type: integer
                          format: int64
                          example: 50
                        count:
                          type: integer
                          format: int64
                          example: 0
                  rateLimits:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: REQUEST_WEIGHT
                        interval:
                          type: string
                          example: MINUTE
                        intervalNum:
                          type: integer
                          format: int64
                          example: 1
                        limit:
                          type: integer
                          format: int64
                          example: 6000
                        count:
                          type: integer
                          format: int64
                          example: 321
  /account.status:
    post:
      summary: 账户信息 (USER_DATA)
      description: 获取当前账户信息。
      tags:
        - account
      operationId: accountStatus
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/ws-api/account#account-status
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/websocket-api/AccountApi/accountStatus.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/websocket_api/account_api/account_status.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/websocket_api/Account/account_status.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/api/account/AccountStatusExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketapi/AccountAPI/AccountStatus/AccountStatus.go
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      x-parameters-notes: '**数据源:** 缓存 => 数据库'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: 客户端生成的请求标识符。
                  example: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - account.status
                  example: account.status
                params:
                  type: object
                  properties:
                    omitZeroBalances:
                      type: boolean
                      example: false
                      default: false
                      description: 如果`true`，将隐藏所有零余额。默认值：`false`。
                    recvWindow:
                      type: number
                      format: float
                      example: 5000
                      maximum: 60000
                      description: 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
                    timestamp:
                      type: integer
                      example: 1770736694138
                      format: int64
                      description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
                    apiKey:
                      type: string
                      description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
                      example: API_KEY
                  additionalProperties: false
                  required:
                    - timestamp
                    - apiKey
              required:
                - id
                - method
                - params
              additionalProperties: false
            example:
              id: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
              method: account.status
              params:
                omitZeroBalances: false
                recvWindow: 5000
                timestamp: 1770736694138
                apiKey: API_KEY
      responses:
        Successful Response:
          description: 账户信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 605a6d20-6588-4cb9-afa0-b0ab087507ba
                  status:
                    type: integer
                    format: int64
                    example: 200
                  result:
                    type: object
                    properties:
                      makerCommission:
                        type: integer
                        format: int64
                        example: 15
                      takerCommission:
                        type: integer
                        format: int64
                        example: 15
                      buyerCommission:
                        type: integer
                        format: int64
                        example: 0
                      sellerCommission:
                        type: integer
                        format: int64
                        example: 0
                      canTrade:
                        type: boolean
                        example: true
                      canWithdraw:
                        type: boolean
                        example: true
                      canDeposit:
                        type: boolean
                        example: true
                      commissionRates:
                        type: object
                        properties:
                          maker:
                            type: string
                            example: 0.0015
                          taker:
                            type: string
                            example: 0.0015
                          buyer:
                            type: string
                            example: 0
                          seller:
                            type: string
                            example: 0
                      brokered:
                        type: boolean
                        example: false
                      requireSelfTradePrevention:
                        type: boolean
                        example: false
                      preventSor:
                        type: boolean
                        example: false
                      updateTime:
                        type: integer
                        format: int64
                        example: 1660801833000
                      accountType:
                        type: string
                        example: SPOT
                      balances:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                              example: BNB
                            free:
                              type: string
                              example: 0
                            locked:
                              type: string
                              example: 0
                      permissions:
                        type: array
                        items:
                          type: string
                          example: SPOT
                      uid:
                        type: integer
                        format: int64
                        example: 354937868
                  rateLimits:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: REQUEST_WEIGHT
                        interval:
                          type: string
                          example: MINUTE
                        intervalNum:
                          type: integer
                          format: int64
                          example: 1
                        limit:
                          type: integer
                          format: int64
                          example: 6000
                        count:
                          type: integer
                          format: int64
                          example: 321
  /allOrderLists:
    post:
      summary: 账户订单列表历史 (USER_DATA)
      description: 查询所有订单列表的信息，按时间范围过滤。
      tags:
        - account
      operationId: allOrderLists
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/ws-api/account#all-order-lists
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/websocket-api/AccountApi/allOrderLists.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/websocket_api/account_api/all_order_lists.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/websocket_api/Account/all_order_lists.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/api/account/AllOrderListsExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketapi/AccountAPI/AllOrderLists/AllOrderLists.go
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      x-parameters-notes: |-
        **数据源:** 数据库

        备注：

        * 如果指定了 `startTime` 和/或 `endTime`，则忽略 `fromId`。

          订单列表是按照最后一次更新的订单列表执行状态的 `transactionTime` 过滤的。

        * 如果指定了 `fromId`，返回的订单列表将是 order list ID >= `fromId`。

        * 如果不指定条件，则返回最近的订单列表。

        * `startTime`和`endTime`之间的时间不能超过 24 小时
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: 客户端生成的请求标识符。
                  example: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
                method:
                  type: string
                  description: WebSocket API 方法名称。
                  enum:
                    - allOrderLists
                  example: allOrderLists
                params:
                  type: object
                  properties:
                    fromId:
                      type: integer
                      example: 1
                      description: 起始的 Order list ID
                    startTime:
                      type: integer
                      format: int64
                      example: 1735693200000
                      description: 毫秒时间戳
                    endTime:
                      type: integer
                      format: int64
                      example: 1735693200000
                      description: 毫秒时间戳
                    limit:
                      type: integer
                      example: 1
                      default: 500
                      maximum: 1000
                      description: '默认值: 500; 最大值: 1000'
                    recvWindow:
                      type: number
                      format: float
                      example: 5000
                      maximum: 60000
                      description: 支持最多三位小数的精度（例如 6000.346），以便可以指定微秒。
                    timestamp:
                      type: integer
                      example: 1770736694138
                      format: int64
                      description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
                    apiKey:
                      type: string
                      description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
                      example: API_KEY
                  additionalProperties: false
                  required:
                    - timestamp
                    - apiKey
              required:
                - id
                - method
                - params
              additionalProperties: false
            example:
              id: 7d3b9b46-5f4f-4c8b-9a2d-0a8f9a4a0f5b
              method: allOrderLists
              params:
                fromId: 1
                startTime: 1735693200000
                endTime: 1735693200000
                limit: 1
                recvWindow: 5000
                timestamp: 1770736694138
                apiKey: API_KEY
      responses:
        Successful Response:
          description: 账户订单列表历史
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 8617b7b3-1b3d-4dec-94cd-eefd929b8ceb
                  status:
                    type: integer
                    format: int64
                    example: 200
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        orderListId:
                          type: integer
                          format: int64
                          example: 1274512
                        contingencyType:
                          type: string
                          example: OCO
                        listStatusType:
                          type: string
                          example: EXEC_STARTED
                        listOrderStatus:
                          type: string
                          example: EXECUTING
                        listClientOrderId:
                          type: string
                          example: 08985fedd9ea2cf6b28996
                        transactionTime:
                          type: integer
                          format: int64
                          example: 1660801713793
                        symbol:
                          type: string
                          example: BTCUSDT
                        orders:
                          type: array
                          items:
                            type: object
                            properties:
                              symbol:
                                type: string
                                example: BTCUSDT
                              orderId:
                                type: integer
                                format: int64
                                example: 12569138901
                              clientOrderId:
                                type: string
                                example: BqtFCj5odMoWtSqGk2X9tU
                  rateLimits:
                    type: array
                    items:
                      type: object
                      properties:
                        rateLimitType:
                          type: string
                          example: REQUEST_WEIGHT
                        interval:
                          type: string
                          example: MINUTE
                        intervalNum:
                          type: integer
                          format: int64
                          example: 1
                        limit:
                          type: integer
                          format: int64
                          example: 6000
                        count:
                          type: integer
                          format: int64
                          example: 321
  /allOrders:
    post:
      summary: 账户订单历史 (USER_DATA)
      description: 查询所有订单（活动、已撤销、已成交）信息，并按时间范围过滤。
      tags:
        - account
      operationId: allOrders
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-spot-trading/api/ws-api/account#all-orders
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/spot/examples/websocket-api/AccountApi/allOrders.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/spot/websocket_api/account_api/all_orders.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/spot/examples/websocket_api/Account/all_orders.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/spot/src/main/java/com/binance/connector/client/spot/websocket/api/account/AllOrdersExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/spot/examples/websocketapi/AccountAPI/AllOrders/AllOrders.go
      x-ip-weight: 20
      x-security-type: USER_DATA
      x-signed: true
      x-parameters-notes: |-
