# 日志等级: trace, debug, info, warn, error
log_level = "info"

# Trading pairs to monitor
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "SUIUSDT", "SPCXUSDT"]

# Futures-only symbols (use /fapi/v1/klines instead of /api/v3/klines)
futures_symbols = ["SPCXUSDT", "HYPEUSDT", "TSLAUSDT", "NVDAUSDT", "AAOIUSDT", "MUUSDT", "SKHYNIXUSDT"]

[server]
host = "0.0.0.0"
port = 8080

[database]
max_connections = 5
min_connections = 1
max_lifetime = 1800

[cache]
[cache.memory]
max_ticks_per_symbol = 1000
ttl_seconds = 300

[cache.redis]
pool_size = 10
ttl_seconds = 3600
max_ticks_per_symbol = 10000

[paper_trading]
enabled = true
strategy = "rsi"
initial_capital = 10000.0

# Data collector configuration
[collector]
# Mode: "disabled" / "tick" / "candle1m"
# - disabled: No data collection (backtest only)
# - tick: Collect tick data (high frequency, ~5000 records/minute/symbol)
# - candle1m: Collect 1m candle data (low frequency, 1 record/minute/symbol, RECOMMENDED)
mode = "candle1m"

# Strategy scheduler configuration
[strategy]
# Analysis interval in seconds (default: 300 = 5 minutes)
interval_secs = 300
# Signal max age in hours (default: 24)
signal_max_age_hours = 24
# Confirm threshold - profit % to confirm signal (default: 0.5)
confirm_threshold_pct = 0.5
# Stop loss threshold - loss % to close signal (default: -2.0)
stop_loss_pct = -2.0
# Take profit threshold - profit % to close signal (default: 3.0)
take_profit_pct = 3.0

# Enable tick data collection in parallel (for high-frequency analysis)
# This will use more resources but provides more detailed data
enable_tick = false

# Poll interval in seconds (only for candle1m mode)
poll_interval_secs = 10

# Historical data backfill (runs once on startup)
backfill_enabled = true
backfill_start_date = "2018-01-01"
