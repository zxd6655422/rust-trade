[package]
name = "strategy-service"
version = "0.1.0"
edition = "2021"

[dependencies]
trading-common = { path = "../trading-common" }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal", "uuid"] }
rust_decimal = { version = "1.32", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
chrono = { version = "0.4.35", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
redis = { version = "0.23.0", features = ["tokio-comp", "connection-manager"] }
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["query"] }
tower-http = { version = "0.5", features = ["cors"] }
rust_decimal_macros = "1.8"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
