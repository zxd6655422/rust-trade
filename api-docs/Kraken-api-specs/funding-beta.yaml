ated fee.","type":"object","properties":{"base_fee":{"description":"Fixed fee component.","type":"object","properties":{"asset":{"description":"Asset in which the amount is denominated.","type":"object","properties":{"class":{"description":"Asset class.","type":"string","enum":["currency","tokenized_asset"]},"name":{"description":"Asset name.","type":"string","minLength":1,"maxLength":16}},"required":["class","name"]},"amount":{"description":"Decimal amount.","type":"string","pattern":"^[+-]?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))$"}},"required":["asset","amount"]},"fee_percentage":{"description":"Percentage fee component.","type":"string","pattern":"^[+-]?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))$"}},"required":["base_fee","fee_percentage"]},"withdrawal_fee_token":{"description":"Token identifying the calculated withdrawal fee quote for a later request. Expires after 5 minutes and can be used on multiple withdrawals.","type":"string","minLength":1}},"required":["fee","gross_amount","net_amount","fee_details"]},"example":{"fee":{"asset":{"class":"currency","name":"USDC"},"amount":"1.00000000"},"gross_amount":{"asset":{"class":"currency","name":"USDC"},"amount":"5.00000000"},"net_amount":{"asset":{"class":"currency","name":"USDC"},"amount":"4.00000000"},"fee_details":{"base_fee":{"asset":{"class":"currency","name":"USDC"},"amount":"1.00000000"},"fee_percentage":"0"},"withdrawal_fee_token":"AAAAAAAAAAHG33Wc1eES6QpeGgMok_gUnlZC7Y5niezI2,MBriLCyg8oqCX7SH1bSqY6SfmC2ZLf_SgTxNZj4Cd1RLPaTyZE..."}}}}},"security":[{"API-Key":[],"API-Sign":[],"API-Nonce":[]},{"API-Key":[],"API-Sign":[],"API-Nonce":[],"API-OTP":[]}]}},"/funding/v1/deposit/address":{"put":{"tags":["funding-beta"],"summary":"Claim Funding Deposit Address","operationId":"claimFundingDepositAddressV1","x-mint":{"content":"<Note>\nClaim with the deposit `method_id` you want to use. If that method shares addresses with another method on the same network (for example ERC-20s with ETH on Ethereum, TRC-20s with TRX on Tron, or SPLs