  /fapi/v1/order/test:
    post:
      summary: 下单测试
      description: 用于测试订单请求，但不会提交到撮合引擎
      tags:
        - trade
      operationId: testOrder
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/rest-api/trade#test-order
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/rest-api/TradeApi/testOrder.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/rest_api/trade_api/test_order.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/rest_api/Trade/test_order.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/rest/trade/TestOrderExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/restapi/TradeAPI/TestOrder/TestOrder.go
        php: https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/derivatives-trading-usds-futures/trade/TestOrderExample.php
      x-security-type: TRADE
      x-signed: true
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: 访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API Key，请参考：https://www.binance.com/cn/support/faq/detail/360002502072。
          schema:
            type: string
            example: API_KEY
      x-parameters-notes: |-
        根据 order `type` 的不同，某些参数强制要求如下：

        | Type                                | 强制要求的参数                     |
        | ----------------------------------- | ---------------------------------- |
        | `LIMIT`                             | `timeInForce`, `quantity`, `price` |
        | `MARKET`                            | `quantity`                         |
        | `STOP`, `TAKE_PROFIT`               | `quantity`, `price`, `stopPrice`   |
        | `STOP_MARKET`, `TAKE_PROFIT_MARKET` | `stopPrice`                        |
        | `TRAILING_STOP_MARKET`              | `callbackRate`                     |

        - 条件单触发规则：
          - 若 `priceProtect=true`，达到触发价时，`MARK_PRICE` 与 `CONTRACT_PRICE` 的价差不能超过 `triggerProtect`（可通过 `GET /fapi/v1/exchangeInfo` 获取）。
          - `STOP`, `STOP_MARKET`：
            - 买入：最新价 >= `stopPrice`
            - 卖出：最新价 <= `stopPrice`
          - `TAKE_PROFIT`, `TAKE_PROFIT_MARKET`：
            - 买入：最新价 <= `stopPrice`
            - 卖出：最新价 >= `stopPrice`
          - `TRAILING_STOP_MARKET`：
            - 买入：区间最低价 <= `activationPrice` 且最新价相对最低价达到回调幅度
            - 卖出：区间最高价 >= `activationPrice` 且最新价相对最高价达到回调幅度
        - `TRAILING_STOP_MARKET` 若报错 `{"code": -2021, "msg": "Order would immediately trigger."}`：
          - 买入：`activationPrice` 必须小于最新价
          - 卖出：`activationPrice` 必须大于最新价
        - `newOrderRespType=RESULT` 时：
          - `MARKET` 订单将直接返回最终成交结果
          - 特殊 `timeInForce` 的 `LIMIT` 订单将直接返回最终状态（`FILLED` 或 `EXPIRED`）
        - `STOP_MARKET`、`TAKE_PROFIT_MARKET` 配合 `closePosition=true` 时：
          - 按条件单规则触发
          - 触发后全部平仓（卖单平多，买单平空）
          - 不支持 `quantity`
          - 不支持 `reduceOnly`
          - 双向持仓模式下，`LONG` 不支持 `BUY`，`SHORT` 不支持 `SELL`
        - `selfTradePreventionMode` 仅在 `timeInForce` 为 `IOC`、`GTC` 或 `GTD` 时生效。
        - 极端行情下，`timeInForce=GTD` 订单的自动取消时间可能相对 `goodTillDate` 延迟。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - symbol
                - side
                - type
                - timestamp
              properties:
                symbol:
                  type: string
                  example: BTCUSDT
                side:
                  type: string
                  example: BUY
                  enum:
                    - BUY
                    - SELL
                positionSide:
                  type: string
                  example: BOTH
                  enum:
                    - BOTH
                    - LONG
                    - SHORT
                  description: 持仓方向，单向持仓模式下非必填，默认且仅可填`BOTH`;在双向持仓模式下必填,且仅可选择 `LONG` 或 `SHORT`
                type:
                  type: string
                  example: LIMIT
                  enum:
                    - LIMIT
                    - MARKET
                    - STOP
                    - STOP_MARKET
                    - TAKE_PROFIT
                    - TAKE_PROFIT_MARKET
                    - TRAILING_STOP_MARKET
                reduceOnly:
                  type: string
                  example: 'true'
                  default: 'false'
                  enum:
                    - 'true'
                    - 'false'
                  description: 双开模式下不接受此参数；使用`closePosition`不支持此参数。
                quantity:
                  type: number
                  example: '1.0'
                  format: float
                  description: 下单数量,使用`closePosition`不支持此参数。
                price:
                  type: number
                  example: '1.0'
                  format: float
                newClientOrderId:
                  type: string
                  example: '1'
                  description: 用户自定义的订单号，不可以重复出现在挂单中。如空缺系统会自动赋值。必须满足正则规则 `^[\.A-Z\:/a-z0-9_-]{1,36}$`
                stopPrice:
                  type: number
                  example: '1.0'
                  format: float
                  description: 触发价, 仅 `STOP`, `STOP_MARKET`, `TAKE_PROFIT`, `TAKE_PROFIT_MARKET` 需要此参数
                closePosition:
                  type: string
                  example: 'false'
                  enum:
                    - 'true'
                    - 'false'
                  description: 触发后全部平仓，仅支持 `STOP_MARKET` 和 `TAKE_PROFIT_MARKET`。
                activationPrice:
                  type: number
                  example: '1.0'
                  format: float
                  description: 追踪止损激活价格，仅`TRAILING_STOP_MARKET` 需要此参数, 默认为下单当前市场价格(支持不同`workingType`)
                callbackRate:
                  type: number
                  example: 1
                  minimum: 0.1
                  maximum: 5
                  format: float
                  description: 追踪止损回调比例，仅 `TRAILING_STOP_MARKET` 使用。
                timeInForce:
                  type: string
                  example: GTC
                  enum:
                    - GTC
                    - IOC
                    - FOK
                    - GTX
                    - GTD
                    - RPI
                workingType:
                  type: string
                  example: MARK_PRICE
                  default: CONTRACT_PRICE
                  enum:
                    - MARK_PRICE
                    - CONTRACT_PRICE
                priceProtect:
                  type: string
                  example: 'true'
                  default: 'false'
                  enum:
                    - 'true'
                    - 'false'
                newOrderRespType:
                  type: string
                  example: ACK
                  default: ACK
                  enum:
                    - ACK
                    - RESULT
                priceMatch:
                  type: string
                  example: OPPONENT
                  enum:
                    - OPPONENT
                    - OPPONENT_5
                    - OPPONENT_10
                    - OPPONENT_20
                    - QUEUE
                    - QUEUE_5
                    - QUEUE_10
                    - QUEUE_20
                  description: 盘口价格下单模式，不能与 `price` 同时传入。
                selfTradePreventionMode:
                  type: string
                  example: EXPIRE_TAKER
                  default: NONE
                  enum:
                    - NONE
                    - EXPIRE_TAKER
                    - EXPIRE_BOTH
                    - EXPIRE_MAKER
                  description: 订单自成交保护模式，默认 `NONE`。
                goodTillDate:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: TIF为GTD时订单的自动取消时间， 当`timeInforce`为`GTD`时必传；传入的时间戳仅保留秒级精度，毫秒级部分会被自动忽略，时间戳需大于当前时间+600s且小于253402300799000
                recvWindow:
                  type: integer
                  example: 5000
                  format: int64
                timestamp:
                  type: integer
                  example: 1770736694138
                  format: int64
                  description: 用于请求签名的 Unix 时间戳，单位为毫秒. 该值必须反映客户端当前时间，并会在签名接口中由服务器进行校验.
      responses:
        '200':
          description: Test 订单
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientOrderId:
                    type: string
                    example: testOrder
                    description: Client Order Id.
                  cumQty:
                    type: string
                    example: '0'
                  cumQuote:
                    type: string
                    example: '0'
                    description: Cum Quote.
                  executedQty:
                    type: string
                    example: '0'
                    description: Executed Qty.
                  orderId:
                    type: integer
                    example: 22542179
                    format: int64
                    description: Order Id.
                  avgPrice:
                    type: string
                    example: '0.00000'
                    description: Avg Price.
                  origQty:
                    type: string
                    example: '10'
                    description: Orig Qty.
                  price:
                    type: string
                    example: '0'
                    description: Price.
                  reduceOnly:
                    type: boolean
                    example: false
                    description: Reduce Only.
                  side:
                    type: string
                    example: SELL
                    description: Side.
                  positionSide:
                    type: string
                    example: SHORT
                    description: Position Side.
                  status:
                    type: string
                    example: NEW
                    description: Status.
                  stopPrice:
                    type: string
                    example: '0'
                    description: 触发价，对`TRAILING_STOP_MARKET`无效
                  closePosition:
                    type: boolean
                    example: false
                    description: 是否条件全平仓
                  symbol:
                    type: string
