  /tradingSession:
    post:
      summary: 当前交易时段
      description: |-
        每秒返回传统金融合约标的资产（美股市场、韩国股票市场、香港股票市场及大宗商品市场）的当前交易时段信息。不同标的市场的交易时段信息由不同消息推送。

        **事件类型：**

        - `EquityUpdate`：美股市场的时段类型包括 "PRE_MARKET"、"REGULAR"、"AFTER_MARKET"、"OVERNIGHT" 和 "NO_TRADING"。
        - `CommodityUpdate`：大宗商品市场的时段类型包括 "REGULAR" 和 "NO_TRADING"。
        - `KR_EquityUpdate`：韩国股票市场的时段类型包括 "REGULAR" 和 "NO_TRADING"。
        - `HK_EquityUpdate`：香港股票市场的时段类型包括 "REGULAR" 和 "NO_TRADING"。
      tags:
        - market
      operationId: tradingSessionStream
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/ws-streams/market#trading-session-stream
      x-connectors-examples:
        ts: https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/derivatives-trading-usds-futures/examples/websocket-streams/MarketApi/tradingSessionStream.ts
        rust: https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/derivatives_trading_usds_futures/websocket_streams/market_api/trading_session_stream.rs
        python: https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/derivatives_trading_usds_futures/examples/websocket_streams/Market/trading_session_stream.py
        java: https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/derivatives-trading-usds-futures/src/main/java/com/binance/connector/client/derivatives_trading_usds_futures/websocket/stream/websocketmarketstreams/market/TradingSessionStreamExample.java
        go: https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/derivativestradingusdsfutures/examples/websocketstreams//MarketAPI/TradingSessionStream/TradingSessionStream.go
      x-update-speed: 1s
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            example: e9d6b4349871b40611412680b3445fac
          description: 唯一 WebSocket 请求 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: WebSocket 数据流方法名称。
                  enum:
                    - SUBSCRIBE
                  example: SUBSCRIBE
                params:
                  type: array
                  items:
                    type: string
                  description: 要订阅的数据流列表。
                  example:
                    - tradingSession
                id:
                  type: string
                  example: e9d6b4349871b40611412680b3445fac
                  description: 唯一的 WebSocket 请求 ID。
              required:
                - method
                - params
                - id
              additionalProperties: false
            example:
              method: SUBSCRIBE
              params:
                - tradingSession
              id: e9d6b4349871b40611412680b3445fac
      responses:
        Raw Stream:
          description: 交易时段流
          content:
            application/json:
              schema:
                type: object
                properties:
                  e:
                    type: string
                    example: EquityUpdate
                    description: 事件类型, 也可以是CommodityUpdate、KR_EquityUpdate或HK_EquityUpdate
                  E:
                    type: integer
                    example: 1765244143062
                    format: int64
                    description: 事件时间
                  t:
                    type: integer
                    example: 1765242000000
                    format: int64
                    description: 交易时段开始时间
                  T:
                    type: integer
                    example: 1765270800000
                    format: int64
                    description: 交易时段结束时间
                  S:
                    type: string
