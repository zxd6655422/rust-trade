  /futures/data/topLongShortAccountRatio:
    get:
      summary: 大户账户数多空比
      description: |-
        持仓大户的净持仓多头和空头账户数占比，大户指保证金余额排名前20%的用户。一个账户记一次。
        多仓账户数比例 = 持多仓大户数 / 总持仓大户数
        空仓账户数比例 = 持空仓大户数 / 总持仓大户数
        多空账户数比值 = 多仓账户数比例 / 空仓账户数比例
      tags:
        - market-data
      operationId: topTraderLongShortRatioAccounts
      externalDocs:
        url: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/rest-api/market-data#top-trader-long-short-ratio-accounts
